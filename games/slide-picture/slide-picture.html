<script>
// ===== 설정 =====
const GAME_ID = 'slide-picture';
const K = { hi: `retro_${GAME_ID}_hi`, best: `retro_${GAME_ID}_best`, mute: `retro_${GAME_ID}_mute` };
const STEP = 1 / 60;                 // 고정 갱신 간격
const BOARD_UNIT = 600;              // 보드 논리 크기
const PAD = 12;                      // 보드 바깥 여백
const CLEARS_PER_SIZE = 2;           // 한 크기에서 몇 번 이기면 조각이 늘어나는지
const MAX_SIZE = 5;
const SHUFFLE_STEPS = { 3: 40, 4: 90, 5: 160 };
const STAR_MOVES = { 3: [30, 50], 4: [90, 140], 5: [190, 290] }; // [별3 이하, 별2 이하] 이동 횟수
const SIZE_LABEL = { 3: '쉬움', 4: '보통', 5: '어려움' };
const CLOSE_TIME = 0.45, ALIVE_SHOW = 2.6;
const TAU = Math.PI * 2;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ===== 저장 =====
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } }
};
let best = store.get(K.best, {});          // { '3': {stars, moves, time}, ... }
let totalStars = clamp(+store.get(K.hi, 0) || 0, 0, 99999);

// ===== 사운드 (WebAudio 합성) =====
const Snd = {
  ctx: null, muted: !!store.get(K.mute, false),
  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; try { this.ctx = new AC(); } catch (e) { this.ctx = null; } },
  tone(f, d, type = 'sine', v = 0.05, delay = 0, to = 0) {
    if (!this.ctx || this.muted) return;
    try { const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + Math.min(0.02, d * 0.3)); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + 0.05); } catch (e) { /* 무시 */ }
  },
  slide(n) { this.tone(380 + (n % 5) * 40, 0.09, 'triangle', 0.05, 0, 560); },
  bad() { this.tone(200, 0.12, 'sine', 0.04, 0, 150); },
  ui() { this.tone(660, 0.07, 'sine', 0.04); },
  shuffle() { [440, 520, 600, 700].forEach((f, i) => this.tone(f, 0.06, 'triangle', 0.04, i * 0.05)); },
  clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.06, i * 0.1)); },
  star(i) { this.tone(880 + i * 220, 0.18, 'sine', 0.06, 0.55 + i * 0.22); },
  toggle() { this.muted = !this.muted; store.set(K.mute, this.muted); return this.muted; }
};
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 무시 */ } }

// ===== 그림 (모두 코드로 그림) =====
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function circ(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function ell(g, x, y, rx, ry, c, rot = 0) { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fill(); }
function rect(g, x, y, w, h, c, r = 0) { g.fillStyle = c; if (r) rr(g, x, y, w, h, r); else { g.beginPath(); g.rect(x, y, w, h); } g.fill(); }
function poly(g, pts, c) { g.fillStyle = c; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill(); }
function line(g, x1, y1, x2, y2, c, w) { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function curve(g, x1, y1, cx, cy, x2, y2, c, w) { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(cx, cy, x2, y2); g.stroke(); }
function vgrad(g, stops, y0 = 0, y1 = 600) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillRect(0, y0, 600, y1 - y0); }
function starShape(g, x, y, r, c, rot = -Math.PI / 2) { g.fillStyle = c; g.beginPath(); for (let i = 0; i < 10; i++) { const rad = i % 2 ? r * 0.45 : r, a = rot + i * Math.PI / 5; g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); } g.closePath(); g.fill(); }
function cloud(g, x, y, s) { const c = 'rgba(255,255,255,.92)'; ell(g, x, y, 54 * s, 26 * s, c); circ(g, x - 22 * s, y - 14 * s, 26 * s, c); circ(g, x + 14 * s, y - 20 * s, 32 * s, c); }
function lcg(seed) { let s = seed; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function bird(g, x, y, s, t, ph) { const f = Math.sin(t * 7 + ph) * 8 * s; g.strokeStyle = '#4a4a5a'; g.lineWidth = 3.5 * s; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - 16 * s, y + f * 0.5); g.quadraticCurveTo(x - 8 * s, y - 8 * s - f, x, y); g.quadraticCurveTo(x + 8 * s, y - 8 * s - f, x + 16 * s, y + f * 0.5); g.stroke(); }
function balloon(g, x, y, s, t) { const by = y + Math.sin(t * 1.2) * 6; ell(g, x, by, 34 * s, 40 * s, '#ff6a6a'); ell(g, x, by, 12 * s, 40 * s, '#ffd84a'); ell(g, x, by, 34 * s, 8 * s, 'rgba(255,255,255,.35)'); line(g, x - 20 * s, by + 34 * s, x - 10 * s, by + 62 * s, '#6a4a2a', 2.5); line(g, x + 20 * s, by + 34 * s, x + 10 * s, by + 62 * s, '#6a4a2a', 2.5); rect(g, x - 12 * s, by + 62 * s, 24 * s, 16 * s, '#a8723f', 3); }
function kite(g, x, y, t) { const sw = Math.sin(t * 2) * 8; g.save(); g.translate(x + sw, y); g.rotate(0.35 + Math.sin(t * 2) * 0.08); poly(g, [[0, -46], [32, 0], [0, 54], [-32, 0]], '#ff7aa8'); poly(g, [[0, -46], [32, 0], [0, 0]], '#ffd84a'); poly(g, [[0, 0], [-32, 0], [0, 54]], '#6bb8ff'); g.restore(); curve(g, x + sw, y + 50, x + sw - 20, y + 120, x - 60, y + 200, '#6a4a2a', 2.5); for (let i = 0; i < 3; i++) circ(g, x + sw - 6 - i * 12, y + 70 + i * 24 + Math.sin(t * 4 + i) * 3, 6, i % 2 ? '#ff7aa8' : '#6bb8ff'); }
function rainbow(g) { ['#ff6a6a', '#ffa84a', '#ffe14a', '#6bd06a', '#4ab8ff', '#9a6aff'].forEach((c, i) => { g.strokeStyle = c; g.lineWidth = 14; g.beginPath(); g.arc(330, 470, 330 - i * 13, Math.PI * 1.12, Math.PI * 1.88); g.stroke(); }); }
const blink = (t, off = 0) => ((t + off) % 3.4) < 0.14;
function eye(g, x, y, r, t, c = '#2a1f2c', off = 0) { if (blink(t, off)) { line(g, x - r, y, x + r, y, c, r * 0.45); return; } circ(g, x, y, r, c); circ(g, x - r * 0.3, y - r * 0.35, r * 0.35, '#fff'); }

const PICS = [
  { name: '창가의 고양이', draw(g, t) {
    vgrad(g, [[0, '#ffe9c8'], [1, '#f7c9a0']]);
    rect(g, 350, 50, 210, 250, '#8a5a3a', 16); rect(g, 364, 64, 182, 222, '#1b2a5e', 8);
    const R = lcg(7); for (let i = 0; i < 14; i++) { const x = 372 + R() * 166, y = 72 + R() * 206, s = 2 + 2.4 * Math.abs(Math.sin(t * 2 + i)); starShape(g, x, y, s, '#fff4b0'); }
    circ(g, 490, 120, 34, '#fff4c0'); circ(g, 504, 112, 30, '#1b2a5e'); rect(g, 450, 64, 8, 222, '#8a5a3a'); rect(g, 364, 168, 182, 8, '#8a5a3a');
    rect(g, 0, 470, 600, 130, '#c98a5a'); for (let i = 0; i < 6; i++) line(g, i * 110, 470, i * 110 - 30, 600, 'rgba(120,70,30,.25)', 3);
    ell(g, 300, 535, 250, 52, '#e8715a'); ell(g, 300, 535, 200, 36, '#f6a58f'); ell(g, 300, 535, 120, 20, '#e8715a');
    ell(g, 60, 360, 4, 4, '#000'); rect(g, 40, 340, 84, 74, '#b5583a', 10); rect(g, 36, 332, 92, 20, '#c9684a', 8);
    ell(g, 70, 300, 18, 46, '#4fae56', -0.5); ell(g, 100, 290, 18, 52, '#5ec866', 0.2); ell(g, 126, 312, 16, 40, '#4fae56', 0.7);
    curve(g, 400, 450, 500, 470, 470, 370, '#f2a65a', 32); circ(g, 470, 370, 16, '#f2a65a');
    ell(g, 300, 405, 112, 98, '#f2a65a'); for (let i = 0; i < 4; i++) curve(g, 210 + i * 8, 370 + i * 30, 240, 380 + i * 30, 232 + i * 5, 392 + i * 30, '#d98a3d', 8);
    ell(g, 300, 440, 60, 60, '#fff1da'); ell(g, 252, 485, 36, 22, '#fff'); ell(g, 348, 485, 36, 22, '#fff');
    poly(g, [[222, 245], [228, 150], [284, 205]], '#f2a65a'); poly(g, [[378, 245], [372, 150], [316, 205]], '#f2a65a'); poly(g, [[234, 228], [238, 176], [270, 208]], '#ff9aa8'); poly(g, [[366, 228], [362, 176], [330, 208]], '#ff9aa8');
    circ(g, 300, 285, 90, '#f2a65a'); ell(g, 300, 322, 46, 32, '#fff1da');
    for (let i = 0; i < 3; i++) { line(g, 300 + (i - 1) * 16, 198, 300 + (i - 1) * 12, 220, '#d98a3d', 7); }

  phase: 'play', k: 0, aliveT: 0, shown: false, stars: 0, newBest: false, peek: false, numbers: true, particles: [], acc: 0, last: 0, picTick: 0, solvedBefore: false

const PIC = document.createElement('canvas'); PIC.width = PIC.height = BOARD_UNIT; const PG = PIC.getContext('2d');
const board = $('board'), bg = board.getContext('2d');
let cssSize = 320, dpr = 1;

function nextPicture() {
  if (!G.bag.length) { G.bag = PICS.map((_, i) => i); for (let i = G.bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [G.bag[i], G.bag[j]] = [G.bag[j], G.bag[i]]; } if (G.bag[0] === G.picIdx && G.bag.length > 1) G.bag.push(G.bag.shift()); }

function renderPic(t) { PG.save(); PG.clearRect(0, 0, BOARD_UNIT, BOARD_UNIT); try { PICS[G.picIdx].draw(PG, t); } catch (e) { console.error(e); } PG.restore(); }

}
function startRound(keepPic) {

  G.moves = 0; G.time = 0; G.started = false; G.phase = 'play'; G.k = 0; G.aliveT = 0; G.shown = false; G.peek = false; G.particles = []; G.newBest = false; G.stars = 0;

  $('btnPeek').classList.remove('on'); showScreen('game'); updateHud(); layout();
}
function slideAt(p) { // 빈칸과 같은 줄이면 사이의 조각을 모두 한 칸씩 민다. 성공하면 true
  if (G.state !== 'PLAYING' || G.phase !== 'play') return false;
  const n = G.n, b = G.blank, pr = Math.floor(p / n), pc = p % n, br = Math.floor(b / n), bc = b % n;
  if (p === b || (pr !== br && pc !== bc)) return false;

  let cur = b; while (cur !== p) { const nxt = cur + step; G.board[cur] = G.board[nxt]; cur = nxt; }
  G.board[p] = n * n - 1; G.blank = p;
  for (let q = 0; q < n * n; q++) { const id = G.board[q]; if (id !== n * n - 1 && G.vis[id] === undefined) G.vis[id] = { x: q % n, y: Math.floor(q / n) }; }
  G.moves++; G.started = true; Snd.slide(G.moves); buzz(8); updateHud();
  if (isSolved()) onSolved();

}
function arrowMove(dr, dc) { // 조각이 움직이는 방향 (조각은 빈칸의 반대쪽에서 온다)
  const n = G.n, br = Math.floor(G.blank / n), bc = G.blank % n, r = br - dr, c = bc - dc;
  if (r < 0 || c < 0 || r >= n || c >= n) { Snd.bad(); return; }
  slideAt(r * n + c);

function stars(n, moves) { const [a, b] = STAR_MOVES[n]; return moves <= a ? 3 : moves <= b ? 2 : 1; }
function onSolved() {
  G.phase = 'closing'; G.k = 0; G.aliveT = 0; G.stars = stars(G.n, G.moves);
  const rec = best[G.n]; const valid = G.moves > 0 && G.time > 0;
  if (valid) { if (!rec || G.stars > rec.stars || (G.stars === rec.stars && G.moves < rec.moves)) { best[G.n] = { stars: G.stars, moves: G.moves, time: Math.round(G.time) }; G.newBest = true; store.set(K.best, best); } totalStars = clamp(totalStars + G.stars, 0, 99999); store.set(K.hi, totalStars); }
  Snd.clear(); for (let i = 0; i < G.stars; i++) Snd.star(i); buzz(40);
  G.clearsAtSize++;
}

// ===== 렌더 =====
function layout() {
  const land = innerWidth > innerHeight * 1.15 && innerHeight < 760; $('scGame').classList.toggle('land', land);
  const topH = land ? 0 : $('top').offsetHeight + $('tools').offsetHeight + 56;
  const availW = land ? innerWidth - 270 : innerWidth - 20, availH = land ? innerHeight - 24 : innerHeight - topH;
  cssSize = Math.max(200, Math.floor(Math.min(availW, availH, 680)));
  dpr = Math.min(window.devicePixelRatio || 1, 2); $('boardWrap').style.width = $('boardWrap').style.height = cssSize + 'px';
  board.width = board.height = Math.round(cssSize * dpr);
}
function easeTo(a, b, k) { return a + (b - a) * k; }
function drawBoard() {
  const g = bg, n = G.n, cell = (BOARD_UNIT - PAD * 2) / n; g.setTransform(board.width / BOARD_UNIT, 0, 0, board.width / BOARD_UNIT, 0, 0); g.clearRect(0, 0, BOARD_UNIT, BOARD_UNIT);
  rect(g, 0, 0, BOARD_UNIT, BOARD_UNIT, '#b07a46', 26); rect(g, PAD / 2, PAD / 2, BOARD_UNIT - PAD, BOARD_UNIT - PAD, '#8a5a30', 20);
  const gap = G.phase === 'play' ? 3 : 3 * (1 - clamp(G.k, 0, 1)), rad = 10 * (G.phase === 'play' ? 1 : 1 - clamp(G.k, 0, 1));
  if (G.phase === 'alive') { g.save(); rr(g, PAD, PAD, BOARD_UNIT - PAD * 2, BOARD_UNIT - PAD * 2, 12); g.clip(); g.drawImage(PIC, PAD, PAD, BOARD_UNIT - PAD * 2, BOARD_UNIT - PAD * 2); g.restore(); drawParticles(g); return; }
  const src = BOARD_UNIT / n;
  for (let id = 0; id < n * n; id++) {
    const isBlank = id === n * n - 1; if (isBlank && G.phase === 'play') { const bx = PAD + (G.blank % n) * cell, by = PAD + Math.floor(G.blank / n) * cell; rect(g, bx + gap, by + gap, cell - gap * 2, cell - gap * 2, 'rgba(0,0,0,.22)', 10); continue; }
    const v = G.vis[id]; if (!v) continue; const tx = G.board.indexOf(id) % n, ty = Math.floor(G.board.indexOf(id) / n);
    const x = PAD + v.x * cell, y = PAD + v.y * cell, w = cell - gap * 2; if (isBlank) { g.globalAlpha = clamp(G.k, 0, 1); }
    g.save(); rr(g, x + gap, y + gap, w, w, rad); g.clip(); g.drawImage(PIC, (id % n) * src, Math.floor(id / n) * src, src, src, x + gap, y + gap, w, w); g.restore();
    if (G.phase === 'play') { g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2; rr(g, x + gap, y + gap, w, w, rad); g.stroke(); if (G.numbers && !G.peek) { const bw = Math.max(26, cell * 0.22); rect(g, x + gap + 5, y + gap + 5, bw, bw * 0.8, 'rgba(255,251,234,.88)', 8); g.fillStyle = '#4a3320'; g.font = `900 ${Math.round(bw * 0.58)}px "Segoe UI",sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(id + 1), x + gap + 5 + bw / 2, y + gap + 5 + bw * 0.42); } }
    g.globalAlpha = 1; void tx; void ty;
  }
  if (G.peek && G.phase === 'play') { g.save(); g.globalAlpha = 0.97; rr(g, PAD, PAD, BOARD_UNIT - PAD * 2, BOARD_UNIT - PAD * 2, 12); g.clip(); g.drawImage(PIC, PAD, PAD, BOARD_UNIT - PAD * 2, BOARD_UNIT - PAD * 2); g.restore(); }
}
function drawParticles(g) { G.particles.forEach((p) => { g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.globalAlpha = clamp(p.life, 0, 1); if (p.s) starShape(g, 0, 0, p.r, p.c); else { g.fillStyle = p.c; g.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); } g.restore(); }); }
function spawnConfetti() { const cols = ['#ff7aa8', '#ffd84a', '#6bcf4a', '#6bb8ff', '#c98aff', '#ff9a3d']; for (let i = 0; i < 70; i++) G.particles.push({ x: BOARD_UNIT / 2 + (Math.random() - 0.5) * 120, y: BOARD_UNIT * 0.55, vx: (Math.random() - 0.5) * 520, vy: -250 - Math.random() * 420, a: Math.random() * 6, va: (Math.random() - 0.5) * 12, r: 5 + Math.random() * 7, c: cols[i % cols.length], s: i % 4 === 0, life: 2 }); }

// ===== 갱신 (고정 간격) =====
function update(dt) {
  if (G.state === 'PLAYING') {
    const n = G.n, cell = (BOARD_UNIT - PAD * 2) / n; void cell;
    if (G.started && G.phase === 'play' && !G.peek) { G.time += dt; }
    for (let q = 0; q < n * n; q++) { const id = G.board[q], v = G.vis[id]; if (!v) continue; const tx = q % n, ty = Math.floor(q / n), k = 1 - Math.exp(-dt * 22); v.x = easeTo(v.x, tx, k); v.y = easeTo(v.y, ty, k); if (Math.abs(v.x - tx) < 0.001) v.x = tx; if (Math.abs(v.y - ty) < 0.001) v.y = ty; }
    if (G.phase === 'closing') { G.k += dt / CLOSE_TIME; if (G.k >= 1) { G.phase = 'alive'; G.aliveT = 0; spawnConfetti(); } }
    if (G.phase === 'alive') {
      G.aliveT += dt; G.picTick++; if (G.picTick % 2 === 0) renderPic(G.aliveT);
      G.particles.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; p.a += p.va * dt; p.life -= dt * 0.45; }); G.particles = G.particles.filter((p) => p.life > 0 && p.y < BOARD_UNIT + 40);
      if (G.aliveT > ALIVE_SHOW && !G.shown) { G.shown = true; showClear(); }
    }
    updateHud();

}
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let lastHud = '';
function updateHud() { const s = `${G.n}|${G.moves}|${Math.floor(G.time)}`; if (s === lastHud) return; lastHud = s; $('hSize').textContent = `${G.n}×${G.n}`; $('hMoves').textContent = G.moves; $('hTime').textContent = fmt(G.time); }

// ===== 화면 =====
function showScreen(name) { $('scTitle').hidden = name !== 'title'; $('scGame').hidden = name !== 'game' && name !== 'pause'; $('scClear').hidden = name !== 'clear'; $('scPause').hidden = name !== 'pause'; }
let toastT = 0; function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1800); }
function starsText(n) { return '⭐'.repeat(n) + '☆'.repeat(3 - n); }
function showTitle() {
  G.state = 'TITLE'; showScreen('title'); const box = $('sizes'); box.innerHTML = '';
  [3, 4, 5].forEach((n) => { const b = document.createElement('button'); b.className = 'sz'; const r = best[n]; b.innerHTML = `<b>${n}×${n}</b><i>${SIZE_LABEL[n]}</i><s>${r ? starsText(r.stars) : ''}</s>`; b.onclick = () => { Snd.init(); Snd.ui(); G.n = n; G.clearsAtSize = 0; startRound(false); }; box.appendChild(b); });
  $('totalInfo').textContent = totalStars ? `모은 별 ⭐ ${totalStars}개` : '크기를 골라 시작해요!';
}
function showClear() {
  drawCard(); const rec = best[G.n]; $('clearMsg').textContent = G.newBest ? '🎉 새 기록이에요!' : `이 크기 최고 기록: ${rec ? starsText(rec.stars) + ' · ' + rec.moves + '번' : '-'}`;
  const willUp = G.clearsAtSize >= CLEARS_PER_SIZE && G.n < MAX_SIZE; $('btnNext').textContent = willUp ? `다음 그림 (${G.n + 1}×${G.n + 1}로!) ▶` : '다음 그림 ▶';
  showScreen('clear'); G.state = 'CLEAR';
}
function drawCard() {
  const cv = $('cardCv'), g = cv.getContext('2d'), W = 1200, H = 630; const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#fff6dc'); sky.addColorStop(1, '#cdecbe'); g.fillStyle = sky; g.fillRect(0, 0, W, H);
  renderPic(G.aliveT); rect(g, 40, 40, 550, 550, '#a8723f', 30); g.save(); rr(g, 52, 52, 526, 526, 20); g.clip(); g.drawImage(PIC, 52, 52, 526, 526); g.restore();
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round'; g.font = '900 70px "Jua","Malgun Gothic",sans-serif'; g.lineWidth = 12; g.strokeStyle = '#fff'; g.strokeText('조각조각', 640, 130); g.strokeText('그림 마을', 640, 210); g.fillStyle = '#3f9a3a'; g.fillText('조각조각', 640, 130); g.fillText('그림 마을', 640, 210);
  for (let i = 0; i < 3; i++) starShape(g, 700 + i * 130, 320, 56, i < G.stars ? '#ffc21a' : '#d8d0b8');
  g.font = '900 44px "Malgun Gothic",sans-serif'; g.fillStyle = '#4a3320'; g.fillText(`${G.n}×${G.n}  ·  ${PICS[G.picIdx].name}`, 640, 440); g.font = '800 40px "Malgun Gothic",sans-serif'; g.fillStyle = '#7a5a30'; g.fillText(`이동 ${G.moves}번  ·  ${fmt(G.time)}`, 640, 500);
  if (G.newBest) { g.font = '900 38px "Malgun Gothic",sans-serif'; g.fillStyle = '#e0562a'; g.fillText('NEW BEST!', 640, 560); }
  g.textAlign = 'right'; g.font = '800 24px "Malgun Gothic",sans-serif'; g.fillStyle = 'rgba(60,80,40,.8)'; g.fillText('ckurusa.github.io/retro-games', W - 30, H - 22);
}
function shareText() { return `🧩 조각조각 그림 마을 · ${G.n}×${G.n} ${'⭐'.repeat(G.stars)} · 이동 ${G.moves}번 · ${fmt(G.time)}\n▶ https://ckurusa.github.io/retro-games/`; }
function saveCard() { try { $('cardCv').toBlob((b) => { if (!b) { toast('저장할 수 없어요. 화면을 캡처해 주세요'); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'slide-picture-card.png'; document.body.appendChild(a); a.click(); a.remove(); toast('카드를 저장했어요 📷'); }, 'image/png'); } catch (e) { toast('저장할 수 없어요. 화면을 캡처해 주세요'); } }
function copyText() { const t = shareText(), ok = () => toast('글을 복사했어요 📋'), fb = () => { try { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); } catch (e) { toast('복사할 수 없어요'); } }; try { navigator.clipboard.writeText(t).then(ok, fb); } catch (e) { fb(); } }
function nextRound() { if (G.clearsAtSize >= CLEARS_PER_SIZE && G.n < MAX_SIZE) { G.n++; G.clearsAtSize = 0; } startRound(false); }
function pause(on) { if (on) { if (G.state !== 'PLAYING') return; G.state = 'PAUSED'; showScreen('pause'); } else if (G.state === 'PAUSED') { G.state = 'PLAYING'; showScreen('game'); } $('btnPSnd').textContent = '소리: ' + (Snd.muted ? '꺼짐' : '켜짐'); }
function syncSnd() { const t = Snd.muted ? '🔇' : '🔊'; $('btnSnd').textContent = t; $('btnPSnd').textContent = '소리: ' + (Snd.muted ? '꺼짐' : '켜짐'); }

// ===== 입력 =====
function bindUI() {
  const on = (id, fn) => $(id).addEventListener('click', (e) => { Snd.init(); try { fn(e); } catch (er) { console.error(er); } });
  board.addEventListener('pointerdown', (e) => {
    Snd.init(); if (G.peek) { G.peek = false; $('btnPeek').classList.remove('on'); return; }
    const r = board.getBoundingClientRect(), u = BOARD_UNIT / r.width, x = (e.clientX - r.left) * u - PAD, y = (e.clientY - r.top) * u - PAD, n = G.n, cell = (BOARD_UNIT - PAD * 2) / n, c = Math.floor(x / cell), rw = Math.floor(y / cell);
    if (c < 0 || rw < 0 || c >= n || rw >= n) return; if (!slideAt(rw * n + c)) { if (G.state === 'PLAYING' && G.phase === 'play') Snd.bad(); }
  });
  on('btnHome', () => { Snd.ui(); showTitle(); }); on('btnToTitle', () => { showTitle(); }); on('btnTitle2', () => { showTitle(); });
  on('btnPause', () => pause(true)); on('btnResume', () => pause(false));
  on('btnSnd', () => { Snd.toggle(); syncSnd(); Snd.ui(); }); on('btnPSnd', () => { Snd.toggle(); syncSnd(); Snd.ui(); });
  on('btnPeek', () => { if (G.phase !== 'play') return; G.peek = !G.peek; $('btnPeek').classList.toggle('on', G.peek); Snd.ui(); });
  on('btnNum', () => { G.numbers = !G.numbers; $('btnNum').classList.toggle('on', G.numbers); Snd.ui(); });
  on('btnShuffle', () => { Snd.shuffle(); startRound(true); });
  on('btnNext', nextRound); on('btnAgain', () => startRound(true)); on('btnSave', saveCard); on('btnCopy', copyText);
  window.addEventListener('keydown', (e) => {
    Snd.init(); const c = e.code; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(c)) e.preventDefault();
    if (c === 'KeyM') { Snd.toggle(); syncSnd(); toast(Snd.muted ? '소리 꺼짐 🔇' : '소리 켜짐 🔊'); return; }
    if (G.state === 'TITLE') { if (c === 'Enter') { G.n = 3; G.clearsAtSize = 0; startRound(false); } return; }
    if (c === 'KeyP' || c === 'Escape') { pause(G.state === 'PLAYING'); return; }
    if (G.state === 'CLEAR') { if (c === 'Enter' || c === 'Space') nextRound(); return; }
    if (G.state !== 'PLAYING') return;
    if (c === 'ArrowUp' || c === 'KeyW') arrowMove(-1, 0); else if (c === 'ArrowDown' || c === 'KeyS') arrowMove(1, 0); else if (c === 'ArrowLeft' || c === 'KeyA') arrowMove(0, -1); else if (c === 'ArrowRight' || c === 'KeyD') arrowMove(0, 1);
    else if (c === 'Space') { if (G.phase === 'play') { G.peek = !G.peek; $('btnPeek').classList.toggle('on', G.peek); } } else if (c === 'KeyR') { Snd.shuffle(); startRound(true); }
  });
  window.addEventListener('resize', () => { if (!$('scGame').hidden) layout(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
}

// ===== 메인 루프 =====
function loop(ts) {
  try {
    const dt = Math.min(0.1, (ts - G.last) / 1000 || 0); G.last = ts; G.acc += dt;
    while (G.acc >= STEP) { update(STEP); G.acc -= STEP; }
    if (!$('scGame').hidden) drawBoard();
  } catch (e) { console.error(e); } finally { requestAnimationFrame(loop); }
}
bindUI(); syncSnd(); showTitle(); requestAnimationFrame(loop);
