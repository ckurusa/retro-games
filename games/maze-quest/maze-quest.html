<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>미로 탈출 대모험</title>
<meta name="description" content="안개 낀 미로에서 출구를 찾아라! 손전등·지도·망치·번개 신발을 모으고, 열쇠 문·불길·유령을 피해 깊은 층까지 내려가는 레트로 도트 미로찾기. 설치 없이 바로 플레이.">
<meta property="og:title" content="미로 탈출 대모험 - 안개 속 미로찾기">
<meta property="og:description" content="아이템과 함정이 가득한 미로를 탈출해요! 클래식·모험·도전 3가지 모드. 설치 없이 바로 플레이.">
<meta property="og:image" content="https://ckurusa.github.io/retro-games/games/maze-quest/thumbnail.png">
<meta property="og:url" content="https://ckurusa.github.io/retro-games/games/maze-quest/maze-quest.html">
<meta property="og:type" content="website">
<style>
:root{--bg:#14122b;--bg2:#0b0a1c;--tx:#f4f1ff;--mu:#9d97c9;--yl:#ffd23f;--cy:#6ad4ff;--rd:#ff5a5a;--gr:#5ee07a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#262057,var(--bg) 55%,var(--bg2));color:var(--tx);font-family:"Segoe UI","Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-weight:800;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;overflow:auto;text-align:center}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
.logo{margin:0;font-size:clamp(34px,10vw,64px);line-height:1.08;color:var(--yl);letter-spacing:.02em;text-shadow:4px 4px 0 #b2481a,8px 8px 0 rgba(0,0,0,.45)}
.logo small{display:block;margin-top:12px;font-size:clamp(14px,3.8vw,19px);color:var(--cy);letter-spacing:.06em;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.how{margin:0;max-width:460px;font-size:clamp(13px,3.6vw,16px);line-height:1.7;color:var(--mu)}
.how b{color:var(--tx)}
.pb{font:inherit;font-weight:900;font-size:clamp(18px,5vw,22px);color:#1b1740;padding:0 22px;min-height:66px;min-width:min(86vw,300px);border:4px solid #fff;border-radius:6px;cursor:pointer;background:var(--yl);box-shadow:0 6px 0 #b2831a,0 10px 0 rgba(0,0,0,.35)}
.pb:active{transform:translateY(4px);box-shadow:0 2px 0 #b2831a}
.pb.cy{background:var(--cy);box-shadow:0 6px 0 #2a8ab8,0 10px 0 rgba(0,0,0,.35)}
.pb.rd{background:#ff8a7a;box-shadow:0 6px 0 #b24a3a,0 10px 0 rgba(0,0,0,.35)}
.pb.sub{background:#3a3470;color:var(--tx);border-color:#6a62b0;box-shadow:0 6px 0 #231f48,0 10px 0 rgba(0,0,0,.35)}
.pb small{display:block;font-size:12px;opacity:.8;margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
a.hubLink{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border:3px solid #6a62b0;border-radius:6px;background:#241f4f;color:var(--tx);font:inherit;font-weight:900;font-size:15px;text-decoration:none}
.ttl{margin:0;font-size:clamp(24px,7vw,34px);color:var(--yl);text-shadow:3px 3px 0 rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(92vw,420px)}
.lv{font:inherit;font-weight:900;min-height:64px;border:3px solid #6a62b0;border-radius:6px;background:#2a2560;color:var(--tx);cursor:pointer;font-size:18px;line-height:1.1;padding:2px}
.lv small{display:block;font-size:11px;color:var(--yl);min-height:14px}
.lv[disabled]{opacity:.35;cursor:not-allowed}
.lv.cur{border-color:var(--yl);background:#3a3470}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(92vw,380px)}
.sz{font:inherit;font-weight:900;border:3px solid #6a62b0;border-radius:6px;background:#2a2560;color:var(--tx);cursor:pointer;padding:12px 6px;font-size:18px}
.sz small{display:block;font-size:12px;color:var(--cy);margin-top:3px}
.tg{font:inherit;font-weight:900;min-height:56px;padding:0 18px;border:3px solid #6a62b0;border-radius:6px;background:#2a2560;color:var(--tx);cursor:pointer;font-size:16px}
.tg.on{background:var(--cy);color:#1b1740;border-color:#fff}
/* 게임 화면 */
#scGame{padding:8px;gap:8px;justify-content:flex-start}
#scGame>:first-child{margin-top:0}
#top{display:flex;gap:6px;align-items:center;width:100%;max-width:640px}
#hud{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;max-width:640px}
.ib{width:60px;height:60px;border:3px solid #6a62b0;border-radius:6px;background:#2a2560;color:var(--tx);font-size:24px;cursor:pointer;flex:none;padding:0}
.ib:active{transform:translateY(3px)}
.pill{font-size:clamp(13px,3.4vw,16px);padding:5px 8px;border:3px solid #6a62b0;border-radius:6px;background:#241f4f;font-size:clamp(14px,3.8vw,17px);white-space:nowrap}
#hearts span{margin:0 1px}
#hearts .off{opacity:.25;filter:grayscale(1)}
#boardWrap{position:relative;border:6px solid #6a62b0;border-radius:6px;background:#000;box-shadow:0 8px 0 rgba(0,0,0,.4);flex:none;line-height:0}
#cv{width:100%;height:100%;touch-action:none;border-radius:4px}
#mini{position:absolute;right:6px;bottom:6px;background:rgba(10,8,30,.62);border:2px solid rgba(255,255,255,.35);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.5);touch-action:manipulation;cursor:pointer}
#goal{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:clamp(14px,4vw,18px);line-height:1.2;pointer-events:none;color:var(--yl);text-shadow:2px 2px 0 #000,-1px -1px 0 #000}
#ctrl{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;max-width:640px}
#items{display:flex;gap:8px}
.it{position:relative;width:68px;height:68px;border:3px solid #6a62b0;border-radius:6px;background:#2a2560;color:var(--tx);font-size:30px;cursor:pointer;padding:0}
.it:active{transform:translateY(3px)}
.it b{position:absolute;right:2px;bottom:0;font-size:15px;color:var(--yl);text-shadow:1px 1px 0 #000}
.it.act{border-color:var(--yl);background:#4a4290}
.it[disabled]{opacity:.35}
.it i{position:absolute;left:3px;top:0;font-style:normal;font-size:11px;color:var(--mu)}
#dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px}
#dpad button{border:3px solid #6a62b0;border-radius:6px;background:#2a2560;color:var(--tx);font-size:26px;cursor:pointer;padding:0;touch-action:none}
#dpad button:active,#dpad button.on{background:#5a52a8}
#dU{grid-column:2;grid-row:1}#dL{grid-column:1;grid-row:2}#dD{grid-column:2;grid-row:2}#dR{grid-column:3;grid-row:2}
@media (hover:hover) and (pointer:fine){#dpad{display:none}}
#tip{margin:0;font-size:12px;color:var(--mu)}
#scGame.land{display:grid;grid-template-columns:1fr 250px;grid-template-rows:auto auto 1fr;column-gap:14px;align-content:center;justify-items:center;align-items:start}
#scGame.land #boardWrap{grid-column:1;grid-row:1/4;align-self:center}
#scGame.land #top{grid-column:2;grid-row:1;max-width:none;width:100%}
#scGame.land #hud{grid-column:2;grid-row:2}
#scGame.land #ctrl{grid-column:2;grid-row:3;flex-direction:column;align-self:start}
#scGame.land #tip{display:none}
#scGame.land #items{display:grid;grid-template-columns:repeat(2,68px);gap:8px}
.over{background:rgba(10,8,30,.85);z-index:20}
.over h2{margin:0;font-size:clamp(26px,8vw,40px);color:var(--yl);text-shadow:3px 3px 0 #000}
#scResult{z-index:30;background:linear-gradient(180deg,#201a4e,#0e0c24)}
#cardCv{width:min(92vw,560px,calc((100dvh - 250px) * 1.9));height:auto;border:5px solid #fff;border-radius:6px;box-shadow:0 8px 0 rgba(0,0,0,.4)}
#resMsg{font-size:clamp(16px,4.4vw,20px);color:var(--yl);min-height:1.3em}
#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:60;padding:10px 18px;border:3px solid #fff;border-radius:6px;background:#241f4f;color:var(--tx);font-size:clamp(14px,4vw,18px);opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="screen" id="scTitle">
  <h1 class="logo">미로 탈출<br>대모험<small>안개 속에서 출구를 찾아라!</small></h1>
  <p class="how">손전등 · 지도 · 망치 · 번개 신발을 모으고<br><b>열쇠 문 · 불길 · 유령</b>을 피해 출구로 가요!<br>화면을 <b>탭</b>하면 걸어가요 (PC는 방향키)</p>
  <div class="col">
    <button class="pb" id="btnAdv">🗺️ 모험<small>층마다 새로운 아이템과 함정</small></button>
    <button class="pb rd" id="btnChal">❤️ 도전<small>하트 3개로 얼마나 깊이?</small></button>
    <button class="pb cy" id="btnCls">🧭 클래식<small>순수 미로찾기</small></button>
  </div>
  <p class="how" id="titleInfo"></p>
  <a class="hubLink" href="https://ckurusa.github.io/retro-games/">🏠 레트로 게임 목록</a>
</section>

<section class="screen" id="scAdv" hidden>
  <h2 class="ttl">모험 · 층 고르기</h2>
  <div class="grid" id="lvGrid"></div>
  <p class="how" id="advInfo"></p>
  <button class="pb sub" id="btnAdvBack">처음 화면</button>
</section>

<section class="screen" id="scCls" hidden>
  <h2 class="ttl">클래식 · 크기 고르기</h2>
  <div class="sizes" id="clsSizes"></div>
  <button class="tg" id="btnFog">🌫️ 안개: 꺼짐</button>
  <p class="how">안개를 켜면 시야가 좁아져서 더 어려워요.<br>걸린 시간이 기록돼요.</p>
  <button class="pb sub" id="btnClsBack">처음 화면</button>
</section>

<section class="screen" id="scGame" hidden>
  <div id="top">
    <button class="ib" id="btnHome" aria-label="처음 화면">🏠</button>
    <span class="pill" id="pLevel">1층</span>
    <span style="flex:1"></span>
    <button class="ib" id="btnSnd" aria-label="소리">🔊</button>
    <button class="ib" id="btnPause" aria-label="일시정지">⏸</button>
  </div>
  <div id="hud">
    <span class="pill" id="hearts"></span>
    <span class="pill">⏱ <b id="pTime">0:00</b></span>
    <span class="pill" id="pCoin">🪙 0</span>
    <span class="pill" id="pKeys" hidden></span>
  </div>
  <div id="boardWrap"><canvas id="cv" width="864" height="864"></canvas><canvas id="mini" title="미니맵 (누르면 크게/작게)"></canvas><div id="goal"></div></div>
  <div id="ctrl">
    <div id="items">
      <button class="it" id="iFlash" aria-label="손전등"><i>1</i>🔦<b>0</b></button>
      <button class="it" id="iMap" aria-label="지도"><i>2</i>🗺️<b>0</b></button>
      <button class="it" id="iHammer" aria-label="망치"><i>3</i>🔨<b>0</b></button>
      <button class="it" id="iBoots" aria-label="번개 신발"><i>4</i>👟<b>0</b></button>
    </div>
    <div id="dpad"><button id="dU" aria-label="위">▲</button><button id="dL" aria-label="왼쪽">◀</button><button id="dD" aria-label="아래">▼</button><button id="dR" aria-label="오른쪽">▶</button></div>
  </div>
  <p id="tip">가까운 길(4칸까지)을 탭하면 걸어가요 · 방향키/WASD · 1~4 아이템 · P 일시정지</p>
</section>

<section class="screen over" id="scPause" hidden>
  <h2>잠깐 쉬어요</h2>
  <button class="pb" id="btnResume">계속하기</button>
  <button class="pb sub" id="btnPSnd">소리: 켜짐</button>
  <button class="pb sub" id="btnQuit">그만하고 나가기</button>
</section>

<section class="screen" id="scResult" hidden>
  <h2 class="ttl" id="resTitle">탈출 성공!</h2>
  <canvas id="cardCv" width="1200" height="630"></canvas>
  <div id="resMsg"></div>
  <div class="row"><button class="pb" id="btnNext" style="min-width:200px">다음 층 ▶</button></div>
  <div class="row" id="resRow2"><button class="pb cy" id="btnSave" style="min-width:150px">📷 카드 저장</button><button class="pb sub" id="btnCopy" style="min-width:150px">📋 글 복사</button><button class="pb sub" id="btnMenu" style="min-width:150px">메뉴로</button></div>
</section>
<div id="toast"></div>

<script>
// ===== 설정 =====
const GAME_ID = 'maze-quest';
const K = { hi: `retro_${GAME_ID}_hi`, adv: `retro_${GAME_ID}_adv`, cls: `retro_${GAME_ID}_cls`, mute: `retro_${GAME_ID}_mute` };
const STEP = 1 / 60;
const TS = 48, VIEW = 9, VPX = TS * VIEW;       // 타일 크기, 화면에 보이는 칸 수(작은 폰에서도 길이 크게 보이게 9칸)
const MOVE_T = 0.125, BOOT_MULT = 0.55;         // 한 칸 이동 시간, 번개 신발 배율
const FLASH_TIME = 12, MAP_TIME = 5, BOOT_TIME = 8, FLASH_BONUS = 4, INVUL = 1.6;
const MAX_HEARTS = 5, START_HEARTS = 3;
const TAP_MAX = 4;                              // 탭으로 자동 이동할 수 있는 최대 칸 수(멀리는 직접 조작)
const FIRE_CYCLE = 3.0, FIRE_WARN_AT = 1.4, FIRE_ON_AT = 1.9;  // 꺼짐 1.4초, 경고 0.5초, 켜짐 1.1초
const CLS_SIZES = [{ c: 8, n: '작은 미로' }, { c: 12, n: '보통 미로' }, { c: 16, n: '큰 미로' }, { c: 20, n: '특대 미로' }];
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const DOOR_COLORS = ['#ffd23f', '#ff7aa8', '#6ad4ff'];
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } }
};
let advSave = Object.assign({ unlocked: 1, stars: {} }, store.get(K.adv, {}));
let clsSave = Object.assign({ best: {} }, store.get(K.cls, {}));
let bestDepth = clamp(+store.get(K.hi, 0) || 0, 0, 9999);

// ===== 사운드 (WebAudio 합성) =====
const Snd = {
  ctx: null, muted: !!store.get(K.mute, false), timer: null, step: 0, mood: -1,
  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; try { this.ctx = new AC(); } catch (e) { this.ctx = null; } },
  tone(f, d, type = 'square', v = 0.035, delay = 0, to = 0) {
    if (!this.ctx || this.muted) return;
    try { const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + Math.min(0.015, d * 0.3)); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + 0.05); } catch (e) { /* 무시 */ }
  },
  step_() { this.tone(180 + (this.step++ % 2) * 30, 0.04, 'triangle', 0.025); },
  bump() { this.tone(110, 0.07, 'square', 0.03, 0, 80); },
  coin() { this.tone(988, 0.07, 'square', 0.03); this.tone(1319, 0.11, 'square', 0.03, 0.06); },
  item() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.09, 'square', 0.035, i * 0.06)); },
  key() { [784, 988, 1175].forEach((f, i) => this.tone(f, 0.08, 'triangle', 0.04, i * 0.05)); },
  unlock() { this.tone(300, 0.1, 'square', 0.04, 0, 600); this.tone(880, 0.15, 'triangle', 0.04, 0.1); },
  hurt() { this.tone(220, 0.25, 'sawtooth', 0.05, 0, 70); },
  smash() { this.tone(140, 0.12, 'sawtooth', 0.05, 0, 50); },
  power() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.07, 'square', 0.03, i * 0.04)); },
  ghost() { this.tone(160, 0.2, 'triangle', 0.03, 0, 110); },
  clear() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => this.tone(f, 0.18, 'square', 0.04, i * 0.09)); },
  over() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.05, i * 0.18)); },
  ui() { this.tone(660, 0.06, 'square', 0.03); },
  // 배경음악: 층의 분위기(0~3)마다 곡이 달라요
  bgm(mood) {
    if (mood === this.mood) return; this.mood = mood; clearInterval(this.timer); this.timer = null; if (mood < 0) return;
    const sets = [
      { ms: 240, lead: [523, 0, 659, 784, 0, 659, 523, 0, 587, 0, 698, 880, 0, 698, 587, 0], bass: [131, 175, 196, 131] },
      { ms: 290, lead: [330, 0, 392, 0, 440, 0, 392, 330, 294, 0, 349, 0, 392, 0, 349, 294], bass: [110, 98, 131, 98] },
      { ms: 320, lead: [659, 0, 0, 784, 0, 0, 988, 0, 880, 0, 0, 784, 0, 0, 659, 0], bass: [165, 196, 147, 165] },
      { ms: 220, lead: [220, 262, 220, 330, 220, 262, 220, 392, 196, 233, 196, 294, 196, 233, 196, 349], bass: [55, 55, 49, 58] }
    ];
    const m = sets[mood] || sets[0]; let s = 0;
    this.timer = setInterval(() => {
      if (this.muted || !this.ctx) return; const i = s++, f = m.lead[i % m.lead.length];
      if (f) this.tone(f, m.ms / 1000 * 1.8, 'square', 0.012);
      if (i % 4 === 0) this.tone(m.bass[(i / 4 | 0) % m.bass.length], m.ms / 1000 * 3.2, 'triangle', 0.03);
    }, m.ms);
  },
  toggle() { this.muted = !this.muted; store.set(K.mute, this.muted); return this.muted; }
};
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 무시 */ } }

// ===== 그림 (코드로 그린 부드러운 입체 벡터. 한 번만 미리 그려 둔다) =====
const RS = 2;                                    // 그림 해상도 배율(선명하게)
const mk = (draw, w = TS, h = TS) => { const c = document.createElement('canvas'); c.width = w * RS; c.height = h * RS; const g = c.getContext('2d'); g.scale(RS, RS); draw(g); return c; };
