<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>네온 스매시 - 콤보 벽돌깨기</title>
<meta name="description" content="벽돌을 이어서 깰수록 점수 배율이 ×8까지! 설치 없이 바로 즐기는 네온 벽돌깨기 게임.">
<meta property="og:title" content="네온 스매시 - 콤보 벽돌깨기">
<meta property="og:description" content="벽돌을 이어서 깰수록 점수 배율이 ×8까지! 설치 없이 바로 플레이.">
<meta property="og:image" content="https://ckurusa.github.io/retro-games/games/neon-smash/thumbnail.png">
<meta property="og:url" content="https://ckurusa.github.io/retro-games/games/neon-smash/neon-smash.html">
<meta property="og:type" content="website">
<style>
:root{--bg:#05061a;--cyan:#22e6ff;--mag:#ff3df2;--yel:#ffe14d;--text:#eaf6ff;--mute:#8aa0c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{display:grid;place-items:center;
  background:radial-gradient(900px 600px at 50% -10%,rgba(90,30,170,.45),transparent 70%),radial-gradient(700px 500px at 100% 100%,rgba(10,110,150,.4),transparent 70%),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(90,130,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(90,130,255,.08) 1px,transparent 1px);
  background-size:36px 36px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 15%,transparent 75%);mask-image:radial-gradient(circle at 50% 50%,#000 15%,transparent 75%)}
#frame{position:relative;width:360px;height:480px;container-type:inline-size;border-radius:16px;overflow:hidden;background:#070824;
  box-shadow:0 0 0 2px rgba(34,230,255,.55),0 0 36px rgba(34,230,255,.35),0 0 90px rgba(255,61,242,.22)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.topbtns{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:8px;z-index:5;pointer-events:none}
.sp{flex:1}
.ib{pointer-events:auto;width:56px;height:56px;border-radius:16px;border:1px solid rgba(34,230,255,.55);background:rgba(5,6,26,.65);color:var(--cyan);
  display:grid;place-items:center;cursor:pointer;padding:0}
.ib:active{transform:scale(.94)} .ib[hidden]{display:none}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.6cqw;text-align:center;padding:12cqw 7cqw 7cqw;
  background:radial-gradient(circle at 50% 35%,rgba(40,18,90,.93),rgba(3,4,16,.97))}
.overlay[hidden]{display:none}
.logo{margin:0;font-size:12.5cqw;font-weight:900;letter-spacing:.04em;line-height:1;color:#fff;
  text-shadow:0 0 8px var(--cyan),0 0 22px var(--cyan),0 0 46px var(--mag)}
.logo small{display:block;margin-top:2.2cqw;font-size:5.4cqw;letter-spacing:.3em;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.tag{margin:0;color:var(--yel);font-weight:800;font-size:4.4cqw;text-shadow:0 0 12px rgba(255,225,77,.6)}
.how{margin:0;color:var(--mute);font-size:3.5cqw;line-height:1.75}
.how b{color:var(--text)}
.hi{margin:0;color:var(--yel);font-weight:800;font-size:4cqw}
.nb{font:inherit;font-weight:800;font-size:clamp(16px,5cqw,22px);padding:0 28px;min-height:64px;border-radius:999px;border:2px solid var(--cyan);
  background:rgba(34,230,255,.12);color:var(--cyan);cursor:pointer;box-shadow:0 0 16px rgba(34,230,255,.45);transition:transform .08s}
.nb:active{transform:scale(.96)}
.nb.main{border-color:transparent;color:#07102a;background:linear-gradient(120deg,var(--cyan),var(--mag));box-shadow:0 0 24px rgba(255,61,242,.55)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{margin:0;font-size:15cqw;font-weight:900;color:#fff;text-shadow:0 0 14px var(--cyan),0 0 36px var(--mag)}
.ttl{margin:0;font-size:7cqw;font-weight:900;letter-spacing:.06em}
.ttl.over{color:#ff5d7a;text-shadow:0 0 14px #ff2d55} .ttl.win{color:var(--yel);text-shadow:0 0 14px rgba(255,225,77,.8)}
.rows{width:100%;max-width:300px}
.rows div{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.14);color:var(--mute);font-size:4cqw}
.rows b{color:var(--text)}
.note{margin:0;min-height:1.4em;color:var(--yel);font-weight:800;font-size:4.2cqw}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#be123c;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="frame">
  <canvas id="cv"></canvas>

  <div class="overlay" id="ovTitle">
    <h1 class="logo">NEON SMASH<small>네온 스매시</small></h1>
    <p class="tag">이어서 깰수록 점수 ×8 콤보!</p>
    <p class="how"><b>PC</b> 마우스 또는 ← → · A D 이동, 클릭 · Space 발사<br><b>모바일</b> 화면에서 좌우로 밀어 이동, 탭하면 발사<br>공이 패들에 닿기 전까지 벽돌을 이어서 깨 보세요</p>
    <p class="hi" id="hiTitle"></p>
    <button class="nb main" id="btnStart">게임 시작</button>
    <a class="hubLink" href="https://ckurusa.github.io/retro-games/" style="display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 22px;border-radius:999px;background:rgba(127,127,127,.18);color:inherit;font:inherit;font-weight:800;font-size:16px;text-decoration:none;box-shadow:inset 0 0 0 2px currentColor;margin-top:14px">🏠 레트로 게임 목록</a>
  </div>

  <div class="overlay" id="ovPause" hidden>
    <h2 class="ttl">일시정지</h2>
    <button class="nb main" id="btnResume">계속하기</button>
    <button class="nb" id="btnQuit">처음으로</button>
  </div>

  <div class="overlay" id="ovResult" hidden>
    <h2 class="ttl" id="rsTitle">GAME OVER</h2>
    <p class="big" id="rsScore">0</p>
    <p class="note" id="rsNote"></p>
    <div class="rows" id="rsRows"></div>
    <div class="row">
      <button class="nb main" id="btnRetry">다시 도전</button>
      <button class="nb" id="btnCopy">결과 복사</button>
      <button class="nb" id="btnCard">카드 저장</button>
      <button class="nb" id="btnTitle">처음으로</button>
    </div>
  </div>

  <div class="topbtns">
    <button class="ib" id="btnHome" aria-label="처음 화면으로" hidden><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
    <span class="sp"></span>
    <button class="ib" id="btnPause" aria-label="일시정지" hidden><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    <button class="ib" id="btnSnd" aria-label="소리 켜기/끄기"></button>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
'use strict';

// ===== 설정 =====
const GAME_ID = 'neon-smash';
const K = { hi: `retro_${GAME_ID}_hi`, mute: `retro_${GAME_ID}_mute` };
const W = 360, H = 480, STEP = 1 / 120;
const PAD_Y = 438, PAD_H = 10, PAD_BASE_W = 68, PAD_WIDE_W = 104, BALL_R = 5, PAD_KEY_SPEED = 380;
const CEIL_Y = 110, BRICK_TOP = 172, BRICK_GAP = 3, BRICK_H = 13, BRICK_SIDE = 18;
const START_LIVES = 3, MAX_LIVES = 5, MAX_MULT = 8, OD_TIME = 4, DROP_RATE = 0.14, WIDE_TIME = 10;
const STAGE_SPEED = [270, 295, 320, 345, 370]; // 첫 스테이지는 여유 있게 시작해서 점점 빨라진다
// 0 빈칸(공이 들어가 튕기는 통로) / 1 일반(1타) / 2 단단함(2타) / 9 철(파괴 불가)
const STAGES = [
  ['110111011', '110111011'],
  ['121202121', '111101111'],
  ['001111100', '011222110'],
  ['111111111', '190000091', '121202121'],
  ['011000110', '122101221', '012222210', '000121000']
];
const ROW_COLORS = ['#ff3d71', '#ff9f43', '#ffe14d', '#4dff88', '#22e6ff', '#6c8cff', '#ff3df2', '#c77dff'];
const MULT_COLORS = ['#ffffff', '#9ff4ff', '#7dffb0', '#ffe14d', '#ffb347', '#ff6b6b', '#ff3df2', '#c77dff'];
const SCALE = [392, 440, 523, 587, 659, 784, 880, 1047, 1175, 1319, 1568];
const POWER_COLOR = { wide: '#22e6ff', multi: '#7dffb0', life: '#ff3d71' };
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

// ===== 저장 (실패해도 게임은 동작) =====
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } }
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = (id) => document.getElementById(id);

// ===== 사운드 (WebAudio 합성) =====
const Snd = {
  ctx: null, master: null, muted: !!store.get(K.mute, false), timer: null, step: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; }
  },
  tone(f, d, type = 'square', v = 0.05, delay = 0, to = null) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.03);
  },
  noise(d, v = 0.06) {
    if (!this.ctx || this.muted) return;
    const n = Math.floor(this.ctx.sampleRate * d), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = v; s.buffer = buf; s.connect(g); g.connect(this.master); s.start();
  },
  paddle() { this.tone(200, 0.09, 'triangle', 0.09, 0, 320); },
  wall() { this.tone(170, 0.05, 'triangle', 0.05); },
  steel() { this.tone(130, 0.08, 'square', 0.05); },
  // 콤보가 오를수록 높은 음 -> 이어서 깰수록 멜로디가 올라간다
  brick(combo, destroyed) { const f = SCALE[Math.min(SCALE.length - 1, Math.max(0, combo - 1))]; this.tone(f, destroyed ? 0.12 : 0.07, 'square', 0.05); if (destroyed) this.noise(0.04, 0.03); },
  overdrive() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.12, 'sawtooth', 0.05, i * 0.05)); },
  good() { this.tone(660, 0.08, 'square', 0.06); this.tone(990, 0.12, 'square', 0.05, 0.07); },
  lose() { this.noise(0.25, 0.08); this.tone(220, 0.35, 'sawtooth', 0.07, 0, 60); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.15, 'square', 0.06, i * 0.1)); },
  over() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.09, i * 0.18)); },
  bgm(on) {
    clearInterval(this.timer); this.timer = null; if (!on) return;
    const lead = [392, 0, 466, 0, 523, 0, 466, 0, 392, 0, 349, 0, 392, 0, 523, 0], bass = [98, 98, 117, 87];
    this.timer = setInterval(() => {
      const s = this.step++ % 16; if (this.muted || !this.ctx) return;
      if (lead[s]) this.tone(lead[s], 0.16, 'triangle', 0.025);
      if (s % 4 === 0) this.tone(bass[(s / 4) | 0], 0.45, 'sine', 0.05);
    }, 190);
  },
  toggle() { this.muted = !this.muted; store.set(K.mute, this.muted); if (this.muted) this.bgm(false); else if (state === 'playing') this.bgm(true); paintSnd(); }
};

// ===== 상태 =====
const cv = $('cv'), ctx = cv.getContext('2d'), frameEl = $('frame');
let state = 'title'; // title | playing | paused | clear | gameover | victory
let score = 0, lives = START_LIVES, stage = 0, maxMult = 1, broken = 0, hiScore = 0, errors = 0;
let paddle = { x: W / 2 - PAD_BASE_W / 2, w: PAD_BASE_W, wTarget: PAD_BASE_W, target: W / 2 - PAD_BASE_W / 2 };
let balls = [], bricks = [], powerups = [], parts = [], pops = [];
let wideT = 0, clearT = 0, shake = 0, flash = 0, callout = null, hintT = 0, lastResult = null, trailTick = 0;
const keys = { left: false, right: false };
let bgCanvas = null, scaleXY = 1, dpr = 1;

// ===== 화면 맞춤 (3:4 고정 프레임, 어떤 기기에서도 같은 난이도) =====
function fit() {
  const w = Math.max(200, Math.floor(Math.min(window.innerWidth, window.innerHeight * W / H))), h = Math.round(w * H / W);
  frameEl.style.width = w + 'px'; frameEl.style.height = h + 'px';
  dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scaleXY = w / W * dpr; ctx.setTransform(scaleXY, 0, 0, scaleXY, 0, 0); buildBg();
}
function buildBg() {
  bgCanvas = document.createElement('canvas'); bgCanvas.width = cv.width; bgCanvas.height = cv.height;
  const g = bgCanvas.getContext('2d'); g.setTransform(scaleXY, 0, 0, scaleXY, 0, 0);
  const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, '#120a35'); grd.addColorStop(1, '#060820'); g.fillStyle = grd; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(90,130,255,.10)'; g.lineWidth = 1;
  for (let x = 0; x <= W; x += 30) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y <= H; y += 30) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(255,255,255,${0.15 + (i % 5) * 0.08})`; g.fillRect((i * 83) % W, (i * 47) % 90, 1.5, 1.5); }
}

// ===== 스테이지 =====
function initStage(i) {
  const rows = STAGES[i], cols = rows[0].length, bw = (W - BRICK_SIDE * 2 - (cols - 1) * BRICK_GAP) / cols;
  bricks = [];
  rows.forEach((r, ri) => r.split('').forEach((ch, ci) => {
    if (ch === '0') return;
    const hp = ch === '2' ? 2 : 1;
    bricks.push({ x: BRICK_SIDE + ci * (bw + BRICK_GAP), y: BRICK_TOP + ri * (BRICK_H + BRICK_GAP), w: bw, h: BRICK_H, hp, max: hp, type: ch, color: ROW_COLORS[ri % ROW_COLORS.length], cool: 0, dead: false });
  }));
  powerups = []; parts = []; pops = []; balls = []; wideT = 0; paddle.wTarget = PAD_BASE_W;
  spawnBall(); hintT = i === 0 ? 5 : 2.5;
}
function newBall(x, y, vx, vy) { return { x, y, vx, vy, r: BALL_R, attached: false, speed: STAGE_SPEED[stage], combo: 0, mult: 1, od: 0, pierce: false, odUsed: false, trail: [] }; }
function spawnBall() { const b = newBall(paddle.x + paddle.w / 2, PAD_Y - BALL_R - 1, 0, 0); b.attached = true; balls.push(b); }
function launch() {
  let any = false;
  balls.forEach(b => { if (b.attached) { b.attached = false; const a = -Math.PI / 2 + (Math.random() * 0.6 - 0.3); b.vx = Math.cos(a) * b.speed; b.vy = Math.sin(a) * b.speed; any = true; } });
  if (any) { hintT = 0; Snd.paddle(); }
}

// ===== 게임 진행 =====
function setState(s) {
  state = s;
  $('ovTitle').hidden = s !== 'title'; $('ovPause').hidden = s !== 'paused'; $('ovResult').hidden = !(s === 'gameover' || s === 'victory');
  const inGame = s === 'playing' || s === 'paused' || s === 'clear'; $('btnHome').hidden = !inGame; $('btnPause').hidden = !inGame;
}
function startGame() {
  score = 0; lives = START_LIVES; stage = 0; maxMult = 1; broken = 0; keys.left = keys.right = false;
  paddle.w = paddle.wTarget = PAD_BASE_W; paddle.x = paddle.target = W / 2 - PAD_BASE_W / 2;
  initStage(0); setState('playing'); Snd.init(); Snd.bgm(true);
}
function goTitle() { Snd.bgm(false); balls = []; bricks = []; powerups = []; parts = []; pops = []; callout = null; paintTitle(); setState('title'); }
function pause(on) {
  if (on && state === 'playing') { setState('paused'); Snd.bgm(false); }
  else if (!on && state === 'paused') { setState('playing'); if (!Snd.muted) Snd.bgm(true); last = performance.now(); }
}
function nextStage() {
  stage++;
  if (stage >= STAGES.length) { stage = STAGES.length - 1; endGame(true); return; }
  initStage(stage); setState('playing');
}
function stageCleared() {
  const bonus = 100 * (stage + 1) + 150 * lives; score += bonus; clearT = 1.8; callout = { txt: `STAGE ${stage + 1} CLEAR`, sub: `보너스 +${bonus}`, life: 1.8, max: 1.8, color: '#7dffb0' };
  balls = []; powerups = []; setState('clear'); Snd.clear();
}
function loseLife() {
  lives--; shake = REDUCED ? 0 : 0.5; flash = 0.35; Snd.lose();
  if (lives <= 0) { endGame(false); return; }
  wideT = 0; paddle.wTarget = PAD_BASE_W; spawnBall(); hintT = 2.5;
}
function endGame(win) {
  Snd.bgm(false); win ? Snd.clear() : Snd.over();
  const isNew = score > hiScore; if (isNew) { hiScore = score; store.set(K.hi, hiScore); }
  const rows = [['도달 스테이지', `${win ? STAGES.length : stage + 1} / ${STAGES.length}`], ['최고 콤보 배율', '×' + maxMult], ['깬 벽돌', broken]];
  lastResult = { win, score, rows, isNew, share: `[네온 스매시] ${score.toLocaleString()}점 (${win ? '올 클리어!' : `스테이지 ${stage + 1}`}, 최고 콤보 ×${maxMult})` };
  $('rsTitle').textContent = win ? 'ALL CLEAR!' : 'GAME OVER'; $('rsTitle').className = 'ttl ' + (win ? 'win' : 'over');
  $('rsScore').textContent = score.toLocaleString(); $('rsNote').textContent = isNew && score > 0 ? '신기록!' : `최고 기록 ${hiScore.toLocaleString()}`;
  $('rsRows').innerHTML = rows.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('');
  setState(win ? 'victory' : 'gameover');
}
function paintTitle() { $('hiTitle').textContent = hiScore ? `최고 기록 ${hiScore.toLocaleString()}` : ''; }

// ===== 효과 =====
function burst(x, y, color, n) { for (let i = 0; i < n && parts.length < 300; i++) { const a = Math.random() * 6.283, sp = 40 + Math.random() * 120; parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.35 + Math.random() * 0.3, max: 0.65, color, size: 1.5 + Math.random() * 2 }); } }
function pop(x, y, txt, color) { if (pops.length < 24) pops.push({ x, y, txt, color, life: 0.7, max: 0.7 }); }

// ===== 충돌 =====
function keepAngle(b) {
  const len = Math.hypot(b.vx, b.vy) || 1; b.vx = b.vx / len * b.speed; b.vy = b.vy / len * b.speed;
  const minVy = 0.28 * b.speed; // 거의 수평으로 튕겨 다니는 루프 방지
  if (Math.abs(b.vy) < minVy) { b.vy = (b.vy >= 0 ? 1 : -1) * minVy; b.vx = (b.vx >= 0 ? 1 : -1) * Math.sqrt(b.speed * b.speed - minVy * minVy); }
  const minVx = 0.14 * b.speed; // 똑바로 위아래로만 오가며 한 줄에 갇히는 루프 방지

// ===== 렌더 =====

// ===== 결과 공유 =====

let toastT = 0;

const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';

// ===== 입력 =====

// ===== 메인 루프 =====
