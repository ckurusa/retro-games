<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>잰말놀이 한판 - 가족 잰말 보드게임</title>
<meta name="description" content="회전판을 돌려 규칙을 정하고, 카드를 뽑아 잰말을 틀리지 않고 말해 보세요. 쫑알이와 함께하는 온 가족 웹 보드게임!">
<meta property="og:title" content="잰말놀이 한판 - 가족 잰말 보드게임">
<meta property="og:description" content="회전판을 돌려 규칙을 정하고, 카드를 뽑아 잰말을 틀리지 않고 말해 보세요. 설치 없이 바로 플레이!">
<meta property="og:image" content="https://ckurusa.github.io/retro-games/games/jaenmal-hanpan/thumbnail.png">
<meta property="og:url" content="https://ckurusa.github.io/retro-games/games/jaenmal-hanpan/jaenmal-hanpan.html">
<meta property="og:type" content="website">
<style>
:root{
  --bg0:#0F0B24; --bg1:#1A1442; --ink:#0F0B24; --txt:#fff; --mute:#b7acdf;
  --sun:#FFD65A; --pink:#FF8FC8; --mint:#5BEAC1; --sky:#6CC6FF; --violet:#A98BFF; --tomato:#FF7A6B; --orange:#FFB36B; --ice:#8BE9FF;
  --font:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--txt);font-family:var(--font);font-weight:700;-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--bg0)}
body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(120% 70% at 50% -10%,#3b2a8c 0%,var(--bg1) 48%,var(--bg0) 100%) fixed;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
h1,h2,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

/* 무대 배경: 스포트라이트와 바닥 빛 */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.beam{position:absolute;top:-8%;left:50%;width:70vmax;height:125vh;margin-left:-35vmax;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 72%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transform-origin:50% 0;mix-blend-mode:screen}
.beam.b1{transform:rotate(-16deg);animation:sway 9s ease-in-out infinite}.beam.b2{transform:rotate(16deg);animation:sway 11s ease-in-out infinite reverse}
@keyframes sway{50%{transform:rotate(3deg);opacity:.7}}
.floor{position:absolute;left:50%;bottom:-24vh;width:150vmax;height:56vh;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(169,139,255,.38),rgba(169,139,255,0))}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 16px 28px;min-height:100dvh;overflow-x:clip} /* 날아오는 카드·커지는 배너가 가로 스크롤을 만들지 않게 */

/* 버튼 */
.btn{min-height:72px;padding:0 28px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--mint),var(--sky));color:var(--ink);font-weight:900;font-size:clamp(19px,5.4vw,24px);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 28px rgba(91,234,193,.38),inset 0 -4px 0 rgba(0,0,0,.14);transition:transform .08s,filter .15s;text-align:center}
.btn:active:not([disabled]){transform:scale(.96)} .btn:hover:not([disabled]){filter:brightness(1.06)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.pink{background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 10px 28px rgba(255,143,200,.35),inset 0 -4px 0 rgba(0,0,0,.14);color:#fff}
.btn.sun{background:linear-gradient(135deg,var(--sun),var(--orange));box-shadow:0 10px 28px rgba(255,214,90,.35),inset 0 -4px 0 rgba(0,0,0,.14)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.btn.sm{min-height:64px;font-size:17px;padding:0 20px}
.btn.wide{width:100%}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.icon{min-height:56px;min-width:56px;padding:0 14px;border:0;border-radius:16px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icon:active{transform:scale(.95)}
.icon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* 마스코트 쫑알이 */
.mascot{display:block;width:100%;height:100%}
.mascot svg{width:100%;height:100%;overflow:visible;display:block}
.mascot *{transform-box:fill-box;transform-origin:center}
.mascot .m-happy,.mascot .m-x,.mascot .m-smile,.mascot .m-star,.mascot .m-sweat{display:none}
.mascot[data-mood="idle"] .m-body,.mascot[data-mood="think"] .m-body{animation:float 2.6s ease-in-out infinite}
.mascot[data-mood="idle"] .m-eyes,.mascot[data-mood="talk"] .m-eyes{animation:blink 4.2s infinite}
.mascot[data-mood="talk"] .m-body{animation:float 1.4s ease-in-out infinite}
.mascot[data-mood="talk"] .mouth{animation:talk .26s ease-in-out infinite alternate}
.mascot[data-mood="cheer"] .m-eyes{display:none}.mascot[data-mood="cheer"] .m-happy,.mascot[data-mood="cheer"] .m-star{display:block}
.mascot[data-mood="cheer"] .mouth{display:none}.mascot[data-mood="cheer"] .m-smile{display:block}
.mascot[data-mood="cheer"] .m-body{animation:jump .62s ease-out 3}
.mascot[data-mood="cheer"] .armL{transform:translateY(-34px) rotate(-20deg)}.mascot[data-mood="cheer"] .armR{transform:translateY(-34px) rotate(20deg)}
.mascot[data-mood="oops"] .m-eyes{display:none}.mascot[data-mood="oops"] .m-x,.mascot[data-mood="oops"] .m-sweat{display:block}
.mascot[data-mood="oops"] .m-body{animation:tumble 1.1s ease-in-out}
.mascot[data-mood="oops"] .mouth{transform:scaleY(.55)}
.mascot .m-star{animation:twinkle .6s ease-in-out infinite alternate}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(6px) scale(1.08,.9)}60%{transform:translateY(-26px) scale(.95,1.06)}}
@keyframes tumble{0%{transform:rotate(0)}30%{transform:rotate(-24deg) translateX(-6px)}60%{transform:rotate(300deg) translateX(8px)}100%{transform:rotate(360deg)}}
@keyframes twinkle{from{opacity:.35;transform:scale(.7)}to{opacity:1;transform:scale(1.15)}}

/* 설정(타이틀) 화면 */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
.hero .mascot-slot{width:132px;height:132px}
.logo{margin-top:2px;font-size:clamp(44px,13.5vw,64px);font-weight:900;line-height:1.02;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#ffe9a8 60%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,214,90,.45))}
.logo span{display:block;background:linear-gradient(180deg,var(--sun),var(--pink));-webkit-background-clip:text;background-clip:text}
.sub{margin-top:10px;color:var(--mute);font-size:clamp(15px,4.2vw,18px);letter-spacing:.04em}
.panel{margin-top:22px;padding:16px;border-radius:24px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14);backdrop-filter:blur(6px)}
.sec{margin:0 0 10px;font-size:15px;font-weight:800;color:var(--mute);letter-spacing:.08em}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}.stepper .big{font-size:26px;font-weight:900}
.stepper .btn{min-width:64px;padding:0}
.players{display:grid;gap:10px;margin-top:12px}
.pl{display:grid;gap:8px;padding:10px;border-radius:18px;background:rgba(255,255,255,.06)}
.pl .head{display:flex;align-items:center;gap:10px}
.dot{flex:none;width:16px;height:16px;border-radius:50%}
.pl input{flex:1;min-width:0;min-height:52px;border:0;border-radius:14px;padding:0 14px;font:inherit;font-weight:800;font-size:19px;background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22);-webkit-user-select:text;user-select:text}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:64px;border:0;border-radius:14px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);font-weight:800;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--ink);box-shadow:0 6px 18px rgba(255,214,90,.4)}
.cta{position:sticky;bottom:12px;margin-top:18px;display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px;border-radius:999px;background:rgba(15,11,36,.72);backdrop-filter:blur(8px)}
.hi{margin-top:12px;text-align:center;color:var(--mute);min-height:1.3em;font-size:14px}

/* 게임 화면 */
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar .round{flex:1;text-align:center;font-weight:900;font-size:17px;color:var(--mute);letter-spacing:.06em}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-bottom:6px}
.pc{position:relative;padding:8px 6px 7px;border-radius:16px;text-align:center;min-width:0;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14);transition:transform .2s,background .2s}
.pc .sc{display:block;font-size:26px;font-weight:900;line-height:1.05}
.pc .nm{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;color:var(--mute);overflow:hidden;white-space:nowrap}
.pc .nm span{overflow:hidden;text-overflow:ellipsis}
.pc.cur{transform:scale(1.07);background:rgba(255,214,90,.2);box-shadow:0 0 0 2.5px var(--sun),0 0 24px rgba(255,214,90,.5)}
.pc.cur .nm{color:#fff}
.pc .sc.pop{animation:scpop .5s ease-out}
@keyframes scpop{40%{transform:scale(1.5);color:var(--sun)}}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.host{width:100%;display:flex;align-items:center;gap:10px;min-height:92px}
.host .mascot-slot{flex:none;width:88px;height:88px}
.bubble{position:relative;flex:1;min-width:0;padding:12px 16px;border-radius:20px;background:#fff;color:var(--ink);font-size:clamp(16px,4.6vw,19px);line-height:1.35;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:bubin .3s ease-out}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#fff;border-left:0}
@keyframes bubin{from{transform:scale(.8) translateX(-10px);opacity:0}}
.turnTitle{font-size:clamp(22px,6.4vw,28px);font-weight:900}
.turnTitle i{font-style:normal;color:var(--sun);text-shadow:0 0 20px rgba(255,214,90,.6)}

/* 회전판 */
.wheelWrap{position:relative;width:min(88vw,348px);aspect-ratio:1;margin-top:6px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
.wheelWrap .pointer{position:absolute;left:50%;top:-16px;width:0;height:0;margin-left:-17px;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid var(--sun);filter:drop-shadow(0 0 10px rgba(255,214,90,.9));z-index:3}
.wheelWrap .pointer.wig{animation:wig .12s}
@keyframes wig{50%{transform:rotate(-16deg)}}
.wheelClip{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 0 50px rgba(169,139,255,.55)} /* 돌아가는 정사각형 상자의 모서리가 삐져나와 가로 스크롤이 생기는 것을 막는다 */
.wheel{width:100%;height:100%;will-change:transform}
.wheel svg{width:100%;height:100%;display:block;overflow:visible}
.bulb{fill:#fff;animation:chase 1.2s linear infinite;filter:drop-shadow(0 0 3px #fff)}
.wheelWrap.spinning .bulb{animation-duration:.36s}
@keyframes chase{0%,100%{opacity:1}50%{opacity:.18}}
.stage[data-phase="landed"] .wheelWrap{transform:scale(.62);margin-top:-52px;margin-bottom:-76px;opacity:.7}

/* 효과 배너 */
.banner{position:relative;width:100%;padding:14px 16px}
.banner .t{font-size:clamp(30px,10vw,46px);font-weight:900;line-height:1.1;text-shadow:0 0 24px currentColor}
.banner .d{word-break:keep-all;overflow-wrap:anywhere;margin-top:6px;font-size:clamp(16px,4.4vw,19px);color:#fff}
.banner.big{animation:slam .6s cubic-bezier(.2,1.2,.3,1)}
@keyframes slam{0%{transform:scale(2.6);opacity:0}55%{transform:scale(.9);opacity:1}75%{transform:scale(1.06)}100%{transform:scale(1)}}
.banner.small{display:inline-flex;align-items:center;gap:8px;width:auto;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1.5px currentColor}
.banner.small .t{font-size:17px;text-shadow:none}.banner.small .d{display:none}

/* 카드 */
.scene{position:relative;width:100%;perspective:1100px;padding:6px 0}
.spot{position:absolute;left:50%;top:-30px;width:130%;height:calc(100% + 80px);transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.deal{position:relative}
.scene.dealing .deal{animation:dealin .7s cubic-bezier(.2,1.1,.3,1)}
@keyframes dealin{0%{transform:translateY(70vh) rotate(-14deg) scale(.55);opacity:0}100%{transform:none;opacity:1}}
.flip{position:relative;width:100%;display:grid;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.2,.4,1)}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:190px;display:grid;place-items:center;padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px}
.face.back{background:linear-gradient(145deg,#7c5cff,#c46bff 55%,#ff8fc8);box-shadow:0 18px 44px rgba(124,92,255,.55),inset 0 0 0 4px rgba(255,255,255,.35);font-size:78px;font-weight:900;color:rgba(255,255,255,.95);text-shadow:0 4px 16px rgba(0,0,0,.25)}
.face.front{background:linear-gradient(160deg,#fffdf4,#ffeccc);color:#241a4d;transform:rotateY(180deg);font-size:clamp(28px,8vw,40px);font-weight:900;line-height:1.38;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 18px 44px rgba(0,0,0,.4),0 0 0 4px var(--lv,var(--sun)),0 0 40px var(--lv,var(--sun))}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px;color:var(--mute)}

/* 시간 링 */
.timer{display:grid;place-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(255,255,255,.16);stroke-width:12}
.ring .prog{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke .3s;filter:drop-shadow(0 0 8px currentColor)}
.ring .tx{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:900}
.ring.low{animation:panic .5s ease-in-out infinite}
@keyframes panic{50%{transform:scale(1.1)}}
.app.panic::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(255,122,107,.6);animation:vig .5s ease-in-out infinite alternate;z-index:5}
@keyframes vig{from{opacity:.25}to{opacity:1}}

/* 판정 투표 · 연속 성공 · 더블 */
.vote{width:100%;display:grid;gap:10px}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;background:rgba(255,255,255,.07)}
.vrow .nm{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:19px;text-align:left}
.vb{flex:none;min-width:76px;min-height:64px;border:0;border-radius:16px;font-size:30px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);cursor:pointer;transition:transform .08s}
.vb:active{transform:scale(.93)}
.vb[aria-pressed="true"]{transform:scale(1.06)}
.vb.up[aria-pressed="true"]{background:linear-gradient(135deg,var(--mint),var(--sky));box-shadow:0 6px 18px rgba(91,234,193,.5)}
.vb.down[aria-pressed="true"]{background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 6px 18px rgba(255,143,200,.5)}
.pc .fl{flex:none;margin-left:2px;font-size:12px;color:var(--sun)}
.chip.hot{background:rgba(255,214,90,.22);color:#fff;box-shadow:inset 0 0 0 1.5px var(--sun)}
.btn[aria-pressed="true"].sun{outline:3px solid #fff}

/* 결과 */
.result{position:relative;width:100%}
.result .gain{font-size:clamp(72px,24vw,112px);font-weight:900;line-height:1;animation:gainpop .7s cubic-bezier(.2,1.4,.3,1);text-shadow:0 0 36px currentColor}
@keyframes gainpop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.result .msg{margin-top:8px;font-size:clamp(22px,6.4vw,28px)}
.result .calc{margin-top:6px;font-size:15px;color:var(--mute)}
.stage[data-phase="result"] .host{flex-direction:column;text-align:center}
.stage[data-phase="result"] .host .mascot-slot{width:150px;height:150px}
.stage[data-phase="result"] .bubble{display:none}
.actions{width:100%;display:grid;gap:12px;margin-top:4px}

/* 끝 화면 */
.crown{text-align:center;margin:8px 0 6px;font-size:clamp(28px,8.6vw,40px);font-weight:900;line-height:1.2;text-shadow:0 0 30px rgba(255,214,90,.6)}
.endhost{display:grid;place-items:center}.endhost .mascot-slot{width:130px;height:130px}
.rank{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:10px 0 18px;padding:0;list-style:none}
.rank li{position:relative;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.07);overflow:hidden;font-size:19px}
.rank li .bar2{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(91,234,193,.5),rgba(108,198,255,.28));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.rank li.win .bar2{background:linear-gradient(90deg,rgba(255,214,90,.7),rgba(255,143,200,.35))}
.rank li>*{position:relative}
.rank .no{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);font-weight:900}
.rank li.win .no{background:var(--sun);color:var(--ink)}
.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .pt{font-weight:900;font-size:24px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 게임 방법(튜토리얼) */
#tutorial{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:rgba(10,7,28,.82);backdrop-filter:blur(6px)}
.tut-box{width:min(100%,420px);padding:20px 18px 18px;border-radius:30px;background:linear-gradient(170deg,#2a1f66,#1a1442);box-shadow:0 0 0 2px rgba(255,255,255,.18),0 30px 80px rgba(0,0,0,.6);text-align:center}
.tut-stage{position:relative;height:250px;display:grid;place-items:center;overflow:hidden;border-radius:22px;background:radial-gradient(closest-side,rgba(169,139,255,.3),transparent)}
.tut-cap{margin-top:14px;min-height:3.2em;font-size:clamp(18px,5vw,21px);line-height:1.45;font-weight:800}
.dots{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .3s}.dots i.on{width:28px;border-radius:6px;background:var(--sun)}
.tut-btns{display:grid;grid-template-columns:auto 1fr;gap:10px}
.tw{width:190px;height:190px;position:relative}.tw .wheel{animation:tutspin 2.6s cubic-bezier(.12,.62,.1,1) forwards}
@keyframes tutspin{to{transform:rotate(1130deg)}}

  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(full).then(() => toast('복사했어요!'), fb); else fb();
}
function saveCard() {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 630; const x = c.getContext('2d'), F = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';
  const g = x.createRadialGradient(600, -40, 40, 600, 200, 900); g.addColorStop(0, '#3b2a8c'); g.addColorStop(0.5, '#1A1442'); g.addColorStop(1, '#0F0B24'); x.fillStyle = g; x.fillRect(0, 0, 1200, 630);
  x.textAlign = 'center'; x.fillStyle = '#b7acdf'; x.font = `800 34px ${F}`; x.fillText(GAME_NAME, 600, 70);
  const w = S.winners || [], title = w.length > 1 ? `공동 우승 ${w.map(q => q.name).join(' · ')}` : `우승 ${w[0] ? w[0].name : ''}`;
  x.save(); x.shadowColor = '#FFD65A'; x.shadowBlur = 40; x.fillStyle = '#FFD65A'; x.font = `900 76px ${F}`; x.fillText('👑 ' + title, 600, 175); x.restore();
  (S.ranked || []).slice(0, 4).forEach((p, i) => { const y = 270 + i * 76; x.fillStyle = 'rgba(255,255,255,.09)'; x.fillRect(190, y - 52, 820, 64); x.textAlign = 'left'; x.fillStyle = p.rank === 1 ? '#FFD65A' : '#fff'; x.font = `800 40px ${F}`; x.fillText(`${p.rank}등  ${p.name} ${TIERS[p.tier].stars}`, 214, y); x.textAlign = 'right'; x.font = `900 46px ${F}`; x.fillText(`${p.score}점`, 986, y); });
  x.textAlign = 'center'; x.fillStyle = '#8f84c4'; x.font = `700 24px ${F}`; x.fillText(location.host || GAME_ID, 600, 600);
  c.toBlob((b) => { if (!b) { toast('이미지를 만들지 못했어요'); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `${GAME_ID}-card.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
}

// ===== 입력 연결 =====
$('plMinus').onclick = () => changePlayers(-1); $('plPlus').onclick = () => changePlayers(1); $('setupStart').onclick = startGame; $('btnHow').onclick = openTutorial;
$('btnHome').onclick = homePress; $('btnSnd').onclick = () => { Snd.init(); Snd.toggle(); };
$('endAgain').onclick = () => { Snd.init(); startGame(); }; $('endSetup').onclick = goSetup; $('endCopy').onclick = copyText; $('endCard').onclick = saveCard;
$('tutNext').onclick = tutNext; $('tutSkip').onclick = closeTutorial;
document.addEventListener('keydown', (e) => {
  if (!$('tutorial').hidden) { if (e.code === 'Escape') closeTutorial(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || (e.target && e.target.tagName === 'INPUT')) return;
  if (e.code === 'KeyM') Snd.toggle();
  else if ((e.code === 'Enter' || e.code === 'Space') && !(e.target && e.target.tagName === 'BUTTON')) {
    const b = screenName === 'setup' ? $('setupStart') : screenName === 'game' ? document.querySelector('#actions .primary:not([disabled])') : $('endAgain'); if (b) { e.preventDefault(); b.click(); }
  }
});
$('wheel').append(buildWheelSvg()); mountMascot($('mascotSetup'), 'idle'); mountMascot($('mascot'), 'idle'); mountMascot($('mascotEnd'), 'cheer');
window.addEventListener('resize', () => { if (fxParts.length) { fxCv.width = innerWidth; fxCv.height = innerHeight; } });

// ===== 시작 =====
loadSetup(); paintSnd(); renderSetup(); show('setup'); maybeTutorial();
})();
