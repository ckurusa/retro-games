<style>

html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);

body{display:grid;place-items:center;
  background:radial-gradient(900px 600px at 50% -10%,rgba(90,30,170,.45),transparent 70%),radial-gradient(700px 500px at 100% 100%,rgba(10,110,150,.4),transparent 70%),var(--bg)}

  display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 3cqw;box-shadow:0 0 16px -4px var(--c,var(--cyan));transition:transform .08s}

<div id="frame">

      <button class="mode" id="mCombo" style="--c:#ff3df2"><b>콤보</b><span>연속 판 · 열수록 ×8 · 클리어 시 목숨 +1</span><i id="rCombo"></i></button>

    <button class="tg flag" id="tgFlag" aria-label="깃발 모드"><svg viewBox="0 0 24 24"><path d="M6 21V4M6 4h11l-3 4 3 4H6"/></svg>깃발</button>

    <button class="ib" id="btnHome" aria-label="모드 선택으로" hidden><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
    <span class="sp"></span>
    <button class="ib" id="btnHint" aria-label="힌트" hidden><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="badge" id="hintN">3</span></button>
    <button class="ib" id="btnPause" aria-label="일시정지" hidden><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>

<script>
(() => {
'use strict';

// ===== 설정 =====
const GAME_ID = 'mine-search';
const LOGO = 'MINE SEARCH', SHARE_NAME = '마인서치'; // 이름을 바꿀 때는 여기와 HTML의 <title>·og 태그·타이틀 로고를 함께 바꾼다
const K = { hi: `retro_${GAME_ID}_hi`, mute: `retro_${GAME_ID}_mute` };
const W = 360, H = 480, STEP = 1 / 60;
const BOARD_TOP = 104, BOARD_H = 296, BOARD_W = 336, CELL_MAX = 60;
// 클래식 난이도: 폰 화면(가로 360 기준)에서도 칸이 22px 이상 되도록 판 크기를 정했다. 지뢰 밀도는 표준(약 12%·18%·21%)에 맞춘다.
const LEVELS = { easy: { name: '초급', rows: 9, cols: 9, mines: 10, key: 'classic' }, mid: { name: '중급', rows: 12, cols: 12, mines: 26, key: 'classicMid' }, hard: { name: '고급', rows: 13, cols: 15, mines: 42, key: 'classicHard' } };
// 힌트: 시작 개수, 사용 비용(클래식 +초, 러시 -초, 콤보 -콤보), 표시 시간
const HINT_START = { classic: 3, rush: 1, combo: 3 }, HINT_COMBO_MAX = 3, HINT_COST = { classic: 10, rush: 3, combo: 3 }, HINT_SHOW = 8;
const COMBO_BOARD = { rows: 9, cols: 9, mines: 10 }, COMBO_MINES_STEP = 2, COMBO_MINES_MAX = 18, LIVES = 3, MAX_MULT = 8;
const RUSH_START = 60, RUSH_PENALTY = 8, RUSH_RESET = 0.9, MIN_BONUS = 4;
const COMBO_CLEAR_HOLD = 2.4, CALLOUT_RUSH = 1.6; // 판 클리어 안내 유지 시간 / 러시 안내 유지 시간(초)
const NUM_COLORS = ['', '#22e6ff', '#4dff88', '#ffe14d', '#ff9f43', '#ff6b6b', '#ff3df2', '#c77dff', '#ffffff'];
const SCALE = [392, 440, 523, 587, 659, 784, 880, 1047, 1175, 1319, 1568];
const LONG_PRESS = 0.4, HOLD_SHOW = 0.12, MOVE_TOL = 12; // 길게 누르기(깃발): 시간, 링 표시 시작, 취소 이동 거리
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

// ===== 저장 (실패해도 게임은 동작) =====
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } }
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = (id) => document.getElementById(id);
const fmt = (s) => { const m = Math.floor(s / 60), r = (s % 60).toFixed(1); return m ? `${m}:${r.padStart(4, '0')}` : `${r}초`; };

// ===== 사운드 (WebAudio 합성) =====
const Snd = {
  ctx: null, master: null, muted: !!store.get(K.mute, false), timer: null, step: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; }
  },
  tone(f, d, type = 'square', v = 0.05, delay = 0, to = null) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.03);
  },
  noise(d, v = 0.06) {
    if (!this.ctx || this.muted) return;
    const n = Math.floor(this.ctx.sampleRate * d), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = v; s.buffer = buf; s.connect(g); g.connect(this.master); s.start();
  },
  // 콤보가 높을수록 높은 음, 연쇄 오픈은 음이 계단처럼 올라간다
  open(level) { this.tone(SCALE[clamp(level, 0, SCALE.length - 1)], 0.09, 'triangle', 0.07); },
  cascade(n) { for (let i = 0; i < Math.min(n, 6); i++) this.tone(SCALE[clamp(2 + i, 0, SCALE.length - 1)], 0.07, 'square', 0.035, i * 0.045); },
  flag() { this.tone(660, 0.05, 'square', 0.05); this.tone(880, 0.06, 'square', 0.04, 0.045); },
  unflag() { this.tone(520, 0.06, 'square', 0.04); },
  hint() { this.tone(880, 0.08, 'triangle', 0.06); this.tone(1319, 0.16, 'triangle', 0.05, 0.07); },
  boom() { this.noise(0.4, 0.12); this.tone(110, 0.4, 'sawtooth', 0.08, 0, 40); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.16, 'square', 0.06, i * 0.09)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.09, i * 0.18)); },
  tick() { this.tone(1000, 0.04, 'square', 0.04); },
  bonus() { this.tone(784, 0.08, 'square', 0.06); this.tone(1175, 0.12, 'square', 0.05, 0.07); },
  bgm(on) {
    clearInterval(this.timer); this.timer = null; if (!on) return;
    const lead = [330, 0, 392, 0, 440, 0, 392, 0, 330, 0, 294, 0, 330, 0, 440, 0], bass = [82, 82, 98, 73];
    this.timer = setInterval(() => {
      const s = this.step++ % 16; if (this.muted || !this.ctx) return;
      if (lead[s]) this.tone(lead[s], 0.16, 'triangle', 0.02);
      if (s % 4 === 0) this.tone(bass[(s / 4) | 0], 0.45, 'sine', 0.05);
    }, 210);
  },
  toggle() { this.muted = !this.muted; store.set(K.mute, this.muted); if (this.muted) this.bgm(false); else if (state === 'playing') this.bgm(true); paintSnd(); }
};

// ===== 지뢰판 (규칙) =====
function newBoard(rows, cols, mines) {
  const cells = []; for (let i = 0; i < rows * cols; i++) cells.push({ mine: false, n: 0, open: false, flag: false, boom: false, delay: 0, at: 0 });
  return { rows, cols, mines, cells, placed: false, opened: 0, flags: 0, safeTotal: rows * cols - mines, wrong: new Set(), hint: -1 };
}
function neighbors(b, i) {
  const r = Math.floor(i / b.cols), c = i % b.cols, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue; const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < b.rows && cc >= 0 && cc < b.cols) out.push(rr * b.cols + cc);
  }
  return out;
}
// 첫 번째로 연 칸과 그 주변 8칸에는 지뢰를 두지 않는다 (공간이 부족하면 연 칸만 보호)
function placeMines(b, first) {
  let banned = new Set([first, ...neighbors(b, first)]);
  if (b.rows * b.cols - banned.size < b.mines) banned = new Set([first]);
  const pool = []; for (let i = 0; i < b.cells.length; i++) if (!banned.has(i)) pool.push(i);
  for (let k = pool.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [pool[k], pool[j]] = [pool[j], pool[k]]; }
  pool.slice(0, b.mines).forEach(i => { b.cells[i].mine = true; });
  b.cells.forEach((c, i) => { c.n = neighbors(b, i).filter(j => b.cells[j].mine).length; });
  b.placed = true;
}
// 칸을 연다. 숫자 0이면 주변으로 번진다(연쇄). 반환: { hit, opened, list }
function revealCell(b, idx, now) {
  const c = b.cells[idx]; if (c.open || c.flag) return { hit: false, opened: 0, list: [] };
  if (!b.placed) placeMines(b, idx);
  if (c.mine) { c.open = true; c.boom = true; c.at = now; b.opened += 0; return { hit: true, opened: 0, list: [idx] }; }
  const list = [], q = [[idx, 0]]; c.open = true; c.at = now; c.delay = 0; b.opened++; list.push(idx);
  while (q.length) {
    const [i, d] = q.shift(); if (b.cells[i].n !== 0) continue;
    for (const j of neighbors(b, i)) {
      const cj = b.cells[j]; if (cj.open || cj.flag || cj.mine) continue;
      cj.open = true; cj.at = now; cj.delay = (d + 1) * 0.035; b.opened++; list.push(j); q.push([j, d + 1]);
    }
  }
  return { hit: false, opened: list.length, list };
}
function toggleFlag(b, idx) { const c = b.cells[idx]; if (c.open) return 0; c.flag = !c.flag; b.flags += c.flag ? 1 : -1; return c.flag ? 1 : -1; }
// 코드(chord): 열린 숫자 칸 주변의 깃발 수가 숫자와 같으면 나머지 칸을 한 번에 연다
function chordCells(b, idx, now) {

        const pulse = 0.5 + 0.5 * Math.sin(nowSec * 8); ctx.save(); ctx.shadowColor = '#4dff88'; ctx.shadowBlur = 12; ctx.strokeStyle = '#4dff88'; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.55 + 0.45 * pulse; rr(x + pad, y + pad, w, w, cs * 0.16); ctx.stroke(); ctx.restore();
        ctx.save(); ctx.strokeStyle = '#4dff88'; ctx.lineWidth = Math.max(2, cs * 0.09); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(cx - cs * 0.2, cy + cs * 0.02); ctx.lineTo(cx - cs * 0.05, cy + cs * 0.17); ctx.lineTo(cx + cs * 0.22, cy - cs * 0.16); ctx.stroke(); ctx.restore();

function drawHidden(x, y, w, cs, lit) {

function render() {

function drawHud() {

  const right = (t, c) => { ctx.textAlign = 'right'; ctx.font = `800 14px ${FONT}`; ctx.fillStyle = c || '#8aa0c8'; ctx.fillText(t, W - 14, 76); };

  const mid = (t, c) => { ctx.textAlign = 'center'; if (waiting) { ctx.font = `700 12px ${FONT}`; ctx.fillStyle = 'rgba(234,246,255,.9)'; ctx.fillText('아무 칸이나 열어 시작 · 첫 칸은 안전!', W / 2 + 18, 76); return; } ctx.font = `800 15px ${FONT}`; ctx.fillStyle = c; ctx.fillText(t, W / 2, 76); };
  const minesLeft = board ? board.mines - board.flags : 0;
  if (mode === 'classic') { left(fmt(G.t)); mid(`지뢰 ${minesLeft}`, '#ff6b8a'); right(hi[LEVELS[curLevel].key] ? `${LEVELS[curLevel].name} · 최고 ${fmt(hi[LEVELS[curLevel].key])}` : `클래식 ${LEVELS[curLevel].name}`); }
  else if (mode === 'combo') {
    left(G.score.toLocaleString()); mid('♥'.repeat(Math.max(0, G.lives)) + '♡'.repeat(Math.max(0, LIVES - G.lives)), G.hurt > 0 && Math.floor(G.hurt * 8) % 2 ? '#ffffff' : '#ff3d71'); right(`${G.level}판 · ×${multOf()} 콤보 ${G.combo}`, '#ffe14d');
    const m = multOf(), segW = 24, gap = 3, x0 = (W - (MAX_MULT * segW + (MAX_MULT - 1) * gap)) / 2;

}

// ===== 결과 공유 =====
function copyText(txt) {
  const full = txt + ' ' + location.href;
  const fb = () => { const a = document.createElement('textarea'); a.value = full; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast('복사했어요!'); } catch (e) { toast('복사하지 못했어요'); } a.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(full).then(() => toast('복사했어요!'), fb); else fb();
}
function saveCard(o) {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 630; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1200, 630); g.addColorStop(0, '#2a0f5a'); g.addColorStop(1, '#050719'); x.fillStyle = g; x.fillRect(0, 0, 1200, 630);
  const gl = x.createRadialGradient(950, 90, 10, 950, 90, 420); gl.addColorStop(0, 'rgba(34,230,255,.35)'); gl.addColorStop(1, 'rgba(34,230,255,0)'); x.fillStyle = gl; x.fillRect(0, 0, 1200, 630);
  x.strokeStyle = 'rgba(34,230,255,.6)'; x.lineWidth = 3; x.strokeRect(36, 36, 1128, 558); x.textAlign = 'center';
  x.save(); x.shadowColor = '#22e6ff'; x.shadowBlur = 24; x.fillStyle = '#fff'; x.font = `900 64px ${FONT}`; x.fillText(LOGO, 600, 130); x.restore();
  x.fillStyle = '#8aa0c8'; x.font = `700 30px ${FONT}`; x.fillText({ classic: '클래식', rush: '러시', combo: '콤보' }[mode] + ' · ' + o.title, 600, 180);
  x.save(); x.shadowColor = '#ff3df2'; x.shadowBlur = 30; x.fillStyle = '#ffe14d'; x.font = `900 ${o.big.length > 7 ? 120 : 160}px ${FONT}`; x.fillText(o.big, 600, 340); x.restore();
  x.fillStyle = '#eaf6ff'; x.font = `700 36px ${FONT}`; o.rows.slice(0, 3).forEach(([k, v], i) => x.fillText(`${k}   ${v}`, 600, 420 + i * 52));
  x.fillStyle = '#8aa0c8'; x.font = `600 24px ${FONT}`; x.fillText(location.host || GAME_ID, 600, 590);
  c.toBlob((b) => { if (!b) { toast('이미지를 만들지 못했어요'); return; } const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `${GAME_ID}-card.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
}
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }
const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg>';
function paintSnd() { $('btnSnd').innerHTML = Snd.muted ? ICON_OFF : ICON_ON; }
function paintTitle() {
  const done = ['classic', 'classicMid', 'classicHard'].filter(k => hi[k]).length; $('rClassic').textContent = done ? `기록\n${done}/3` : '';
  $('rEasy').textContent = hi.classic ? `최고\n${fmt(hi.classic)}` : ''; $('rMid').textContent = hi.classicMid ? `최고\n${fmt(hi.classicMid)}` : ''; $('rHard').textContent = hi.classicHard ? `최고\n${fmt(hi.classicHard)}` : ''; $('rRush').textContent = hi.rush ? `최고\n${hi.rush.toLocaleString()}` : ''; $('rCombo').textContent = hi.combo ? `최고\n${hi.combo.toLocaleString()}` : '';
  ['rClassic', 'rEasy', 'rMid', 'rHard', 'rRush', 'rCombo'].forEach(id => { $(id).style.whiteSpace = 'pre-line'; });
}
function paintToggle() { $('tgOpen').classList.toggle('on', !flagMode); $('tgFlag').classList.toggle('on', flagMode); }

// ===== 상태 전환 =====
function setState(s) {
  state = s;
  $('ovTitle').hidden = s !== 'title'; $('ovLevel').hidden = s !== 'level'; $('ovPause').hidden = s !== 'paused'; $('ovResult').hidden = s !== 'over';
  const inGame = s === 'playing' || s === 'paused'; $('btnHome').hidden = !(inGame || s === 'over'); $('btnPause').hidden = s !== 'playing'; $('btnHint').hidden = s !== 'playing'; $('toggle').hidden = s !== 'playing';
  if (s === 'title' || s === 'level') $('btnHome').hidden = true;
}
function goTitle() { Snd.bgm(false); board = null; geo = null; G = null; parts = []; pops = []; callout = null; paintTitle(); setState('title'); }
function pause(on) {
  if (on && state === 'playing' && G && !G.over) { setState('paused'); Snd.bgm(false); }
  else if (!on && state === 'paused') { setState('playing'); if (!Snd.muted) Snd.bgm(true); last = performance.now(); }
}

// ===== 입력 =====
const toLogical = (e) => { const r = frameEl.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
let down = null, hold = null;
frameEl.addEventListener('contextmenu', (e) => e.preventDefault());
frameEl.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button') || state !== 'playing') return; Snd.init();
  if (skipHold()) return;
  const p = toLogical(e), idx = cellAt(p.x, p.y);
  if (e.pointerType === 'mouse') { if (idx < 0) return; if (e.button === 2) doFlag(idx); else if (e.button === 0) (flagMode ? doFlag : doOpen)(idx); return; }

// 길게 누르는 동안: 링 진행률 표시, 시간이 차면 깃발(이미 꽂힌 칸이면 해제). 손을 떼기 전에 처리하고 진동으로 알린다.

document.addEventListener('keydown', (e) => {

  else if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'playing') pause(true); else if (state === 'paused') pause(false); }
  else if (e.code === 'KeyM') Snd.toggle();

window.addEventListener('resize', fit);
$('mClassic').onclick = () => { Snd.init(); paintTitle(); setState('level'); };
$('lvEasy').onclick = () => startMode('classic', 'easy'); $('lvMid').onclick = () => startMode('classic', 'mid'); $('lvHard').onclick = () => startMode('classic', 'hard'); $('btnLvBack').onclick = goTitle; $('btnHint').onclick = useHint; $('mRush').onclick = () => startMode('rush'); $('mCombo').onclick = () => startMode('combo');
$('tgOpen').onclick = () => { flagMode = false; paintToggle(); }; $('tgFlag').onclick = () => { flagMode = true; paintToggle(); };
$('btnResume').onclick = () => pause(false); $('btnQuit').onclick = goTitle; $('btnTitle').onclick = goTitle; $('btnHome').onclick = goTitle;
$('btnPause').onclick = () => pause(true); $('btnRetry').onclick = () => startMode(mode, curLevel);

// ===== 메인 루프 =====
let last = performance.now(), acc = 0;
function frame(now) {
  try {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    while (acc >= STEP) { stepGame(STEP); acc -= STEP; }
    updateHold(); render();
  } catch (e) { errors++; if (window.console) console.error(e); } // 한 프레임의 에러로 루프가 멈추지 않게
  finally { requestAnimationFrame(frame); }

// ===== 시작 =====
// 이름을 바꾸기 전(mine-neon)에 저장된 기록이 있으면 한 번 이어받는다
{ const OLD = { hi: 'retro_mine-neon_hi', mute: 'retro_mine-neon_mute' };
  if (store.get(K.hi, null) === null) { const o = store.get(OLD.hi, null); if (o !== null) store.set(K.hi, o); }
  if (store.get(K.mute, null) === null) { const o = store.get(OLD.mute, null); if (o !== null) store.set(K.mute, o); } }

})();
